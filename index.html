<!DOCTYPE html>
<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  [Supabase 설정]  아래 2가지를 한 번만 해주세요                  ║
  ╚══════════════════════════════════════════════════════════════╝

  (1) Supabase 대시보드 > Authentication > Sign In / Providers
      > "Anonymous Sign-ins" 를 ON  (계정 구분용: 닉네임이 아니라 고유 ID로 트로피를 저장)

  (2) SQL Editor 에서 아래 SQL 전체를 실행

  -- 계정(프로필) 테이블: 로그인 사용자 1명 = 1행, 닉네임은 중복 불가
  create table if not exists public.omok_profiles (
    user_id    uuid primary key references auth.users(id) on delete cascade,
    nickname   text not null check (char_length(nickname) between 2 and 10),
    trophy     integer not null default 100 check (trophy >= 0),
    updated_at timestamptz not null default now()
  );
  create unique index if not exists omok_profiles_nickname_key on public.omok_profiles (lower(nickname));
  alter table public.omok_profiles enable row level security;
  drop policy if exists "profiles read"   on public.omok_profiles;
  drop policy if exists "profiles insert" on public.omok_profiles;
  drop policy if exists "profiles update" on public.omok_profiles;
  create policy "profiles read"   on public.omok_profiles for select using (true);
  create policy "profiles insert" on public.omok_profiles for insert with check (auth.uid() = user_id);
  create policy "profiles update" on public.omok_profiles for update using (auth.uid() = user_id) with check (auth.uid() = user_id);

  -- 방 제목 / 공개·비공개 / 비밀번호(해시) / 방장 생존 신호
  alter table public.rooms
    add column if not exists title         text,
    add column if not exists is_private    boolean not null default false,
    add column if not exists password_hash text,
    add column if not exists host_seen_at  timestamptz,
    add column if not exists created_at    timestamptz not null default now();

  -- 익명 로그인 사용자는 'authenticated' 역할이므로 rooms / moves 접근을 허용
  drop policy if exists "omok rooms all" on public.rooms;
  drop policy if exists "omok moves all" on public.moves;
  create policy "omok rooms all" on public.rooms for all using (true) with check (true);
  create policy "omok moves all" on public.moves for all using (true) with check (true);

  (옛 players 테이블은 더 이상 쓰지 않습니다:  drop table if exists public.players; )

  [Render 배포] 이 파일을 GitHub에 올리고 New > Static Site 로 연결
  (Build Command: 비워두기, Publish Directory: .)
-->

    <script>
        const SUPABASE_URL = 'https://lunsgjjznfhfbtfcvoye.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_n7M5OMb_BIFAeJ0jdL9KBw_foAfZxeB';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentRoomId = null;
        let currentRoomTitle = '';
        let myColor = null;
        let myNickname = '';
        let opponentNickname = '';
        let currentTurn = 'black';
        let roomStatus = 'waiting';
        let boardState = Array(15).fill(null).map(() => Array(15).fill(null));

        // 트로피: 로그인 전에는 임시 캐시값, 로그인 후에는 Supabase profiles 값이 기준
        let myTrophy = parseInt(localStorage.getItem('omok_trophy_cache') || '100');
        let oppTrophy = 100;

        // ===== 계정 =====
        let myUserId = null;   // Supabase 익명 로그인 고유 ID
        let myProfile = null;  // profiles 테이블의 내 행

        let movesSubscription = null;
        let roomSubscription = null;
        let timerInterval = null;
        let timeLeft = 30;
        let hasRequestedRematch = false;

        // ===== 방 목록 / 방장 생존 신호 =====
        const HOST_ALIVE_MS = 90000;      // 이 시간 안에 신호가 없으면 목록에서 제외
        const HEARTBEAT_MS = 10000;
        const LOBBY_POLL_MS = 4000;
        let heartbeatTimer = null;
        let lobbyPollTimer = null;
        let joining = false;

        // ===== AI 대전 상태 =====
        let gameMode = 'online'; // 'online' | 'ai'
        let aiColor = 'white';
        let aiLevel = 'normal';
        let aiThinking = false;
        let aiGameOver = false;
        const AI_WIN_TROPHY = 10;
        const AI_LEVEL_LABEL = { easy: '쉬움', normal: '보통', hard: '어려움' };

        const lobbyScreen = document.getElementById('lobby-screen');
        const gameScreen = document.getElementById('game-screen');
        const boardEl = document.getElementById('omok-board');
        const topStatusMsg = document.getElementById('top-status-msg');
        const roomCodeInput = document.getElementById('room-code-input');
        const roomInfoDisplay = document.getElementById('room-info-display');
        const customToast = document.getElementById('custom-toast');
        const nicknameInput = document.getElementById('nickname-input');

        function getTier(trophy) {
            if (trophy >= 1000) return '👑 오목의 신';
            if (trophy >= 800) return '🔮 마스터';
            if (trophy >= 650) return '🟢 에메랄드';
            if (trophy >= 500) return '💎 다이아몬드';
            if (trophy >= 350) return '⚡ 플래티넘';
            if (trophy >= 250) return '🥇 골드';
            if (trophy >= 150) return '🥈 실버';
            return '🥉 브론즈';
        }

        function updateLobbyUI() {
            document.getElementById('lobby-trophy-display').textContent = `🏆 ${myTrophy} 트로피`;
            document.getElementById('lobby-tier-display').textContent = getTier(myTrophy);
        }
        updateLobbyUI();

        let toastTimer = null;
        function showToast(msg, duration = 2500) {
            customToast.textContent = msg;
            customToast.classList.remove('hidden');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                customToast.classList.add('hidden');
            }, duration);
        }

        // =====================================================
        //            계정 (Supabase 익명 로그인 + profiles)
        // =====================================================
        function setAuthStatus(text, cls) {
            const el = document.getElementById('auth-status');
            el.textContent = text;
            el.className = `text-[10px] ${cls}`;
        }

        async function initAuth() {
            try {
                let { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) {
                    const { data, error } = await supabaseClient.auth.signInAnonymously();
                    if (error) throw error;
                    session = data.session;
                }
                myUserId = session.user.id;

                const { data: prof, error: profErr } = await supabaseClient
                    .from('omok_profiles')
                    .select('*')
                    .eq('user_id', myUserId)
                    .maybeSingle();
                if (profErr) throw profErr;

                if (prof) {
                    myProfile = prof;
                    myTrophy = prof.trophy;
                    nicknameInput.value = prof.nickname;
                    localStorage.setItem('omok_trophy_cache', myTrophy);
                }
                setAuthStatus('✅ 계정 연결됨', 'text-emerald-400');
            } catch (e) {
                console.warn('계정 연결 실패:', e);
                setAuthStatus('⚠️ 계정 연결 실패 (트로피 저장 안 됨)', 'text-red-400');
                showToast('계정 연결 실패: Supabase에서 Anonymous 로그인 활성화와 SQL 실행을 확인하세요.', 5000);
            }
            updateLobbyUI();
        }

        // 닉네임을 내 계정에 등록/변경한다. 이미 다른 사람이 쓰는 닉네임이면 false
        async function ensureProfile(nick) {
            if (nick.length < 2) {
                showToast('닉네임은 2자 이상 입력해주세요!');
                return false;
            }
            if (!myUserId) { // 계정 연결 실패 시 로컬 모드로 진행
                myNickname = nick;
                return true;
            }
            try {
                if (!myProfile) {
                    const { data, error } = await supabaseClient
                        .from('omok_profiles')
                        .insert({ user_id: myUserId, nickname: nick, trophy: 100 })
                        .select()
                        .single();
                    if (error) throw error;
                    myProfile = data;
                } else if (myProfile.nickname !== nick) {
                    const { data, error } = await supabaseClient
                        .from('omok_profiles')
                        .update({ nickname: nick, updated_at: new Date().toISOString() })
                        .eq('user_id', myUserId)
                        .select()
                        .single();
                    if (error) throw error;
                    myProfile = data;
                }
                myNickname = nick;
                myTrophy = myProfile.trophy;
                localStorage.setItem('omok_trophy_cache', myTrophy);
                updateLobbyUI();
                return true;
            } catch (e) {
                if (e && e.code === '23505') {
                    showToast('이미 사용 중인 닉네임입니다. 다른 닉네임을 써주세요.');
                    return false;
                }
                console.warn('프로필 처리 실패:', e);
                showToast('⚠️ 서버 저장 불가(SQL 설정 확인). 이번 판 트로피는 저장되지 않습니다.', 4000);
                myNickname = nick;
                return true;
            }
        }

        async function saveTrophy() {
            localStorage.setItem('omok_trophy_cache', myTrophy);
            if (!myUserId || !myProfile) return;
            const { error } = await supabaseClient
                .from('omok_profiles')
                .update({ trophy: myTrophy, updated_at: new Date().toISOString() })
                .eq('user_id', myUserId);
            if (error) {
                showToast('트로피 저장 실패: ' + error.message);
            } else {
                myProfile.trophy = myTrophy;
            }
        }

        // =====================================================
        //                     비밀번호 유틸
        // =====================================================
        async function hashPw(pw, salt) {
            const text = `${salt}:${pw}`;
            if (window.crypto && crypto.subtle) {
                const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
                return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
            }
            // crypto.subtle을 쓸 수 없는 환경용 간이 해시
            let h = 5381;
            for (let i = 0; i < text.length; i++) h = ((h * 33) ^ text.charCodeAt(i)) >>> 0;
            return 'x' + h.toString(16);
        }

        function askPassword(roomTitle) {
            return new Promise(resolve => {
                const modal = document.getElementById('pw-modal');
                const input = document.getElementById('pw-modal-input');
                const okBtn = document.getElementById('pw-ok-btn');
                const cancelBtn = document.getElementById('pw-cancel-btn');
                document.getElementById('pw-modal-title').textContent = `방: ${roomTitle}`;
                input.value = '';
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                setTimeout(() => input.focus(), 50);

                const close = (val) => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                    okBtn.onclick = null;
                    cancelBtn.onclick = null;
                    input.onkeydown = null;
                    resolve(val);
                };
                okBtn.onclick = () => close(input.value);
                cancelBtn.onclick = () => close(null);
                input.onkeydown = (e) => { if (e.key === 'Enter') close(input.value); };
            });
        }

        // 공개/비공개 선택에 따라 비밀번호 입력칸 표시
        document.querySelectorAll('input[name="room-type"]').forEach(radio => {
            radio.addEventListener('change', () => {
                const isPrivate = document.querySelector('input[name="room-type"]:checked').value === 'private';
                document.getElementById('room-password-input').classList.toggle('hidden', !isPrivate);
            });
        });

        // =====================================================
        //                      방 목록(대기열)
        // =====================================================
        function isLobbyVisible() {
            return !lobbyScreen.classList.contains('hidden');
        }

        async function fetchRoomList() {
            if (!isLobbyVisible() || document.hidden) return;
            const since = new Date(Date.now() - HOST_ALIVE_MS).toISOString();
            const { data, error } = await supabaseClient
                .from('rooms')
                .select('id, room_code, title, is_private, black_player, black_trophy, created_at, host_seen_at')
                .eq('status', 'waiting')
                .is('winner', null)
                .gte('host_seen_at', since)
                .order('created_at', { ascending: false })
                .limit(30);

            if (error) {
                renderRoomList([], '방 목록을 불러오지 못했습니다. (SQL 설정을 확인하세요)');
                return;
            }
            renderRoomList(data || []);
        }

        function renderRoomList(rooms, errMsg) {
            const listEl = document.getElementById('room-list');
            listEl.innerHTML = '';

            if (errMsg || rooms.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'text-center text-xs text-slate-500 py-4';
                empty.textContent = errMsg || '대기 중인 방이 없습니다. 직접 방을 만들어 보세요!';
                listEl.appendChild(empty);
                return;
            }

            rooms.forEach(room => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between gap-2 bg-slate-900 border border-slate-700 rounded-xl p-3';

                const left = document.createElement('div');
                left.className = 'min-w-0 flex-grow';

                const titleLine = document.createElement('div');
                titleLine.className = 'flex items-center gap-1.5 min-w-0';
                const badge = document.createElement('span');
                badge.className = room.is_private
                    ? 'shrink-0 text-[10px] px-1.5 py-0.5 rounded-full bg-red-500/20 text-red-300 border border-red-500/30'
                    : 'shrink-0 text-[10px] px-1.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
                badge.textContent = room.is_private ? '🔒 비공개' : '🌐 공개';
                const title = document.createElement('span');
                title.className = 'text-sm font-bold text-slate-100 truncate';
                title.textContent = room.title || `${room.black_player}의 방`;
                titleLine.appendChild(badge);
                titleLine.appendChild(title);

                const sub = document.createElement('div');
                sub.className = 'text-xs text-slate-400 mt-1 truncate';
                const t = room.black_trophy || 100;
                sub.textContent = `⚫ ${room.black_player} · ${getTier(t)} · 🏆${t}`;

                left.appendChild(titleLine);
                left.appendChild(sub);

                const btn = document.createElement('button');
                btn.className = 'shrink-0 px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg text-xs font-bold transition';
                btn.textContent = '입장';
                btn.addEventListener('click', () => tryJoinRoom(room.id));

                row.appendChild(left);
                row.appendChild(btn);
                listEl.appendChild(row);

        }

        function startLobbyPolling() {
            stopLobbyPolling();
            fetchRoomList();
            lobbyPollTimer = setInterval(fetchRoomList, LOBBY_POLL_MS);
        }

        function stopLobbyPolling() {
            clearInterval(lobbyPollTimer);
            lobbyPollTimer = null;
        }

        document.getElementById('room-refresh-btn').addEventListener('click', fetchRoomList);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) fetchRoomList(); });

        // 방장 생존 신호: 대기 중인 동안 주기적으로 갱신 (탭을 그냥 닫아도 목록에서 사라지게)
        function startHeartbeat() {
            stopHeartbeat();
            heartbeatTimer = setInterval(async () => {
                if (roomStatus !== 'waiting' || !currentRoomId) { stopHeartbeat(); return; }
                await supabaseClient
                    .from('rooms')
                    .update({ host_seen_at: new Date().toISOString() })
                    .eq('id', currentRoomId)
                    .eq('status', 'waiting');
            }, HEARTBEAT_MS);
        }

        function stopHeartbeat() {
            clearInterval(heartbeatTimer);
            heartbeatTimer = null;
        }

        // =====================================================
        //                      보드 / 방 입장
        // =====================================================
        function initBoardUI() {
            boardEl.innerHTML = '';
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'relative flex items-center justify-center w-full h-full border border-amber-800/40';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.addEventListener('click', () => handleCellClick(r, c));
                    boardEl.appendChild(cell);
                }
            }
        }

        document.getElementById('create-room-btn').addEventListener('click', async () => {
            const nick = nicknameInput.value.trim();
            if (!nick) {
                showToast('본인의 닉네임을 입력해주세요!');
                return;
            }

            const isPrivate = document.querySelector('input[name="room-type"]:checked').value === 'private';
            const pw = document.getElementById('room-password-input').value;
            if (isPrivate && pw.length < 4) {
                showToast('비공개방은 비밀번호를 4자 이상 입력해주세요.');
                return;
            }

            if (!(await ensureProfile(nick))) return;
            myColor = 'black';
            gameMode = 'online';

            const newRoomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
            const title = document.getElementById('room-title-input').value.trim() || `${myNickname}의 방`;
            const passwordHash = isPrivate ? await hashPw(pw, newRoomCode) : null;

            const { data, error } = await supabaseClient
                .from('rooms')
                .insert([{
                    room_code: newRoomCode,
                    title: title,
                    is_private: isPrivate,
                    password_hash: passwordHash,
                    status: 'waiting',
                    turn: 'black',
                    black_player: myNickname,
                    black_trophy: myTrophy,
                    winner: null,
                    host_seen_at: new Date().toISOString()
                }])
                .select()
                .single();

            if (error) {
                showToast('방 생성 실패: ' + error.message);
                return;
            }

            currentRoomId = data.id;
            currentRoomTitle = title;
            opponentNickname = '';
            startGameSession(newRoomCode, 'waiting');
            startHeartbeat();
        });

        // 방 목록의 [입장] 또는 코드 입장에서 공통으로 사용
        async function tryJoinRoom(roomId) {
            if (joining) return;
            const nick = nicknameInput.value.trim();
            if (!nick) {
                showToast('본인의 닉네임을 입력해주세요!');
                return;
            }

            joining = true;
            try {
                if (!(await ensureProfile(nick))) return;

                const { data: room, error } = await supabaseClient
                    .from('rooms')
                    .select('*')
                    .eq('id', roomId)
                    .maybeSingle();

                if (error || !room) {
                    showToast('존재하지 않는 방입니다.');
                    fetchRoomList();
                    return;
                }

                const alive = room.host_seen_at && (Date.now() - new Date(room.host_seen_at).getTime() < HOST_ALIVE_MS);
                if (room.status !== 'waiting' || room.winner || !alive) {
                    showToast('이미 시작되었거나 닫힌 방입니다.');
                    fetchRoomList();
                    return;
                }
                if (room.black_player === myNickname) {
                    showToast('자신이 만든 방에는 입장할 수 없습니다.');
                    return;
                }

                if (room.is_private) {
                    const pw = await askPassword(room.title || `${room.black_player}의 방`);
                    if (pw === null) return;
                    const hash = await hashPw(pw, room.room_code);
                    if (hash !== room.password_hash) {
                        showToast('비밀번호가 틀렸습니다.');
                        return;
                    }
                }

                // 동시에 두 명이 들어오는 것을 막기 위해 '아직 waiting일 때만' 갱신
                const { data: updatedRows, error: joinErr } = await supabaseClient
                    .from('rooms')
                    .update({
                        status: 'playing',
                        white_player: myNickname,
                        white_trophy: myTrophy
                    })
                    .eq('id', roomId)
                    .eq('status', 'waiting')
                    .select();

                if (joinErr || !updatedRows || updatedRows.length === 0) {
                    showToast('입장에 실패했습니다. 다른 사람이 먼저 입장했을 수 있어요.');
                    fetchRoomList();
                    return;
                }

                currentRoomId = room.id;
                currentRoomTitle = room.title || `${room.black_player}의 방`;
                myColor = 'white';
                gameMode = 'online';
                opponentNickname = room.black_player || '상대방';
                oppTrophy = room.black_trophy || 100;
                startGameSession(room.room_code, 'playing');
            } finally {
                joining = false;
            }
        }

        document.getElementById('join-room-btn').addEventListener('click', async () => {
            const code = roomCodeInput.value.trim().toUpperCase();
            if (!code) {
                showToast('방 코드를 입력해주세요.');
                return;
            }
            const { data, error } = await supabaseClient
                .from('rooms')
                .select('id')
                .eq('room_code', code)
                .maybeSingle();

            if (error || !data) {
                showToast('존재하지 않는 방이거나 코드가 잘못되었습니다.');
                return;
            }
            tryJoinRoom(data.id);
        });

        function startGameSession(code, initialStatus) {
            stopLobbyPolling();
            lobbyScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            roomInfoDisplay.textContent = `${currentRoomTitle} · 코드 ${code}`;
            roomStatus = initialStatus;
            hasRequestedRematch = false;

            document.getElementById('result-overlay').classList.add('hidden');
            const rematchBtn = document.getElementById('rematch-btn');
            rematchBtn.textContent = '🔄 재대결 요청';
            rematchBtn.disabled = false;
            rematchBtn.className = 'w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition text-base';
            document.getElementById('rematch-status-msg').textContent = '';

            updatePlayerCards();
            initBoardUI();
            loadExistingData();
            subscribeToRealtime();
        }

        function updatePlayerCards() {
            document.getElementById('my-name').textContent = myNickname;
            document.getElementById('my-trophy').textContent = `🏆 ${myTrophy} 트로피`;
            document.getElementById('my-tier').textContent = getTier(myTrophy);
            document.getElementById('my-stone-icon').className = `w-6 h-6 rounded-full shadow ${myColor === 'black' ? 'bg-black' : 'bg-white border border-slate-400'}`;

            // AI 모드 상대 카드
            if (gameMode === 'ai') {
                document.getElementById('opp-name').textContent = `🤖 AI (${AI_LEVEL_LABEL[aiLevel]})`;
                document.getElementById('opp-trophy').textContent = '🏆 승리 시 +10';
                document.getElementById('opp-tier').textContent = 'AI';
                document.getElementById('opp-stone-icon').className = `w-6 h-6 rounded-full shadow ${aiColor === 'black' ? 'bg-black' : 'bg-white border border-slate-400'}`;
                return;
            }

            if (opponentNickname) {
                document.getElementById('opp-name').textContent = opponentNickname;
                document.getElementById('opp-trophy').textContent = `🏆 ${oppTrophy} 트로피`;
                document.getElementById('opp-tier').textContent = getTier(oppTrophy);
                const oppColor = (myColor === 'black') ? 'white' : 'black';
                document.getElementById('opp-stone-icon').className = `w-6 h-6 rounded-full shadow ${oppColor === 'black' ? 'bg-black' : 'bg-white border border-slate-400'}`;
            } else {
                document.getElementById('opp-name').textContent = '상대방 입장 대기 중...';
                document.getElementById('opp-trophy').textContent = '🏆 -- 트로피';
                document.getElementById('opp-tier').textContent = '대기 중';
            }
        }

        async function loadExistingData() {
            const { data: roomData } = await supabaseClient
                .from('rooms')
                .select('*')
                .eq('id', currentRoomId)
                .single();

            if (roomData) {
                currentTurn = roomData.turn || 'black';
                roomStatus = roomData.status || 'waiting';

                if (!roomData.winner) {
                    document.getElementById('result-overlay').classList.add('hidden');
                } else {
                    handleGameOver(roomData.winner, false);
                }

                if (myColor === 'black') {
                    opponentNickname = roomData.white_player || '';
                    oppTrophy = roomData.white_trophy || 100;
                } else {
                    opponentNickname = roomData.black_player || '';
                    oppTrophy = roomData.black_trophy || 100;
                }
                updatePlayerCards();
            }

            const { data, error } = await supabaseClient
                .from('moves')
                .select('*')
                .eq('room_id', currentRoomId)
                .order('created_at', { ascending: true });

            if (!error && data) {
                boardState = Array(15).fill(null).map(() => Array(15).fill(null));
                data.forEach(move => {
                    boardState[move.row][move.col] = move.color;
                    renderStone(move.row, move.col, move.color);
                });
            }
            updateTurnUI();
        }

        function subscribeToRealtime() {
            if (movesSubscription) supabaseClient.removeChannel(movesSubscription);
            if (roomSubscription) supabaseClient.removeChannel(roomSubscription);

            movesSubscription = supabaseClient
                .channel(`moves-${currentRoomId}`)
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'moves',
                    filter: `room_id=eq.${currentRoomId}`
                }, payload => {
                    const newMove = payload.new;
                    if (!boardState[newMove.row][newMove.col]) {
                        boardState[newMove.row][newMove.col] = newMove.color;
                        renderStone(newMove.row, newMove.col, newMove.color);

                        currentTurn = (newMove.color === 'black') ? 'white' : 'black';
                        updateTurnUI();
                        checkWinCondition(newMove.row, newMove.col, newMove.color);
                    }
                })
                .on('postgres_changes', {
                    event: 'DELETE',
                    schema: 'public',
                    table: 'moves',
                    filter: `room_id=eq.${currentRoomId}`
                }, () => {
                    boardState = Array(15).fill(null).map(() => Array(15).fill(null));
                    initBoardUI();
                })
                .subscribe();

            roomSubscription = supabaseClient
                .channel(`rooms-${currentRoomId}`)
                .on('postgres_changes', {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'rooms',
                    filter: `id=eq.${currentRoomId}`
                }, payload => {
                    const updated = payload.new;
                    if (updated) {
                        currentTurn = updated.turn || 'black';
                        roomStatus = updated.status || 'waiting';

                        // 재대결로 winner가 null이 되고 흑백 역할이 교체된 경우
                        if (!updated.winner) {
                            document.getElementById('result-overlay').classList.add('hidden');
                            myColor = (updated.black_player === myNickname) ? 'black' : 'white';
                            hasRequestedRematch = false;
                            updatePlayerCards();
                        } else if (updated.winner && document.getElementById('result-overlay').classList.contains('hidden')) {
                            handleGameOver(updated.winner, true);
                        }

                        // 상대방이 재대결을 요청한 상태 감지 (turn에 'rematch_' 문구가 포함될 때)
                        if (updated.turn === 'rematch_wait' && !hasRequestedRematch) {
                            document.getElementById('rematch-status-msg').textContent = '✨ 상대방이 재대결을 원합니다!';
                        }

                        if (myColor === 'black') {
                            opponentNickname = updated.white_player || '';
                            oppTrophy = updated.white_trophy || 100;
                        } else {
                            opponentNickname = updated.black_player || '';
                            oppTrophy = updated.black_trophy || 100;
                        }
                        updatePlayerCards();
                        updateTurnUI();
                    }
                })
                .subscribe();
        }

        async function requestRematch() {
            // AI 모드: 색을 바꿔서 바로 새 게임 시작
            if (gameMode === 'ai') {
                startAiGame(myColor === 'black' ? 'white' : 'black');
                return;
            }

            const rematchBtn = document.getElementById('rematch-btn');
            const rematchMsg = document.getElementById('rematch-status-msg');

            const { data: currentRoom } = await supabaseClient
                .from('rooms')
                .select('*')
                .eq('id', currentRoomId)
                .single();

            if (!currentRoom) return;

            if (!hasRequestedRematch && currentRoom.turn !== 'rematch_wait') {
                // 첫 번째 요청자
                hasRequestedRematch = true;
                rematchBtn.textContent = '수락 대기 중...';
                rematchBtn.disabled = true;
                rematchBtn.className = 'w-full py-3.5 bg-slate-700 text-slate-400 font-bold rounded-xl shadow-lg cursor-not-allowed text-base';
                rematchMsg.textContent = '상대방의 수락을 기다리는 중...';

                await supabaseClient
                    .from('rooms')
                    .update({ turn: 'rematch_wait' })
                    .eq('id', currentRoomId);
            } else {
                // 상대방이 이미 요청한 상태에서 내가 누름 -> 수락 완료! 판 비우고 역할 교대 후 재시작
                await supabaseClient
                    .from('moves')
                    .delete()
                    .eq('room_id', currentRoomId);

                const newBlack = currentRoom.white_player;
                const newWhite = currentRoom.black_player;

                await supabaseClient
                    .from('rooms')
                    .update({
                        turn: 'black',
                        winner: null,
                        black_player: newBlack,
                        white_player: newWhite,
                        black_trophy: (newBlack === myNickname) ? myTrophy : oppTrophy,
                        white_trophy: (newWhite === myNickname) ? myTrophy : oppTrophy
                    })
                    .eq('id', currentRoomId);

                myColor = (newBlack === myNickname) ? 'black' : 'white';
                document.getElementById('result-overlay').classList.add('hidden');
                hasRequestedRematch = false;
                initBoardUI();
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            if (!opponentNickname || roomStatus !== 'playing' || (gameMode === 'ai' && aiGameOver)) {
                document.getElementById('my-timer').textContent = '--s';
                document.getElementById('opp-timer').textContent = '--s';
                return;
            }

            timeLeft = 30;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (currentTurn === myColor) {
                        showToast('시간 초과!');
                    }
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const myTimerEl = document.getElementById('my-timer');
            const oppTimerEl = document.getElementById('opp-timer');

            if (!opponentNickname || roomStatus !== 'playing') {
                myTimerEl.textContent = '--s';
                oppTimerEl.textContent = '--s';
                return;
            }

            if (currentTurn === myColor) {
                myTimerEl.textContent = `${timeLeft}초`;
                oppTimerEl.textContent = '--s';
            } else {
                myTimerEl.textContent = '--s';
                oppTimerEl.textContent = `${timeLeft}초`;
            }
        }

        async function handleCellClick(r, c) {
            // ===== AI 대전 =====
            if (gameMode === 'ai') {
                if (aiGameOver || aiThinking) return;
                if (currentTurn !== myColor) {
                    showToast('지금은 내 차례가 아닙니다!');
                    return;
                }
                if (boardState[r][c] !== null) return;

                const ended = placeAiModeStone(r, c, myColor);
                if (!ended) aiMove();
                return;
            }

            // ===== 온라인 대전 =====
            if (!currentRoomId) return;

            if (!opponentNickname || roomStatus !== 'playing') {
                showToast('아직 상대방이 입장하지 않았습니다!');
                return;
            }

            if (currentTurn !== myColor) {
                showToast('지금은 내 차례가 아닙니다!');
                return;
            }

            if (boardState[r][c] !== null) {
                return;
            }

            const nextTurn = (myColor === 'black') ? 'white' : 'black';

            const { error: moveError } = await supabaseClient
                .from('moves')
                .insert([{ room_id: currentRoomId, row: r, col: c, color: myColor }]);

            if (moveError) {
                showToast('착수 실패: ' + moveError.message);
                return;
            }

            await supabaseClient
                .from('rooms')
                .update({ turn: nextTurn })
                .eq('id', currentRoomId);
        }

        function renderStone(r, c, color) {
            const cell = boardEl.querySelector(`[data-row='${r}'][data-col='${c}']`);
            if (!cell) return;
            cell.innerHTML = '';
            const stone = document.createElement('div');
            stone.className = `w-5/6 h-5/6 rounded-full shadow-lg z-10 ${color === 'black' ? 'bg-black' : 'bg-white border-2 border-slate-300'}`;
            cell.appendChild(stone);

            // 마지막 착수 표시
            boardEl.querySelectorAll('.last-dot').forEach(el => el.remove());
            const dot = document.createElement('div');
            dot.className = 'last-dot';
            cell.appendChild(dot);
        }

        function updateTurnUI() {
            resetTimer();
            if (!opponentNickname || roomStatus !== 'playing') {
                topStatusMsg.textContent = '상대방의 입장을 기다리는 중입니다...';
                topStatusMsg.className = 'text-sm text-slate-400 mt-1';
                return;
            }

            if (currentTurn === myColor) {
                topStatusMsg.textContent = '내 차례입니다!';
                topStatusMsg.className = 'text-sm text-amber-400 font-bold mt-1';
            } else {
                topStatusMsg.textContent = gameMode === 'ai' ? '🤖 AI가 생각 중...' : '상대방의 차례를 기다리는 중...';
                topStatusMsg.className = 'text-sm text-slate-400 mt-1';
            }
        }

        function isFiveInRow(r, c, color) {
            const directions = [
                { dr: 0, dc: 1 },
                { dr: 1, dc: 0 },
                { dr: 1, dc: 1 },
                { dr: 1, dc: -1 }
            ];
            for (let { dr, dc } of directions) {
                let count = 1;
                count += countConsecutive(r, c, dr, dc, color);
                count += countConsecutive(r, c, -dr, -dc, color);
                if (count >= 5) return true;
            }
            return false;
        }

        async function checkWinCondition(r, c, color) {
            if (isFiveInRow(r, c, color)) {
                clearInterval(timerInterval);
                await supabaseClient
                    .from('rooms')
                    .update({ winner: color })
                    .eq('id', currentRoomId);
            }
        }

        function handleGameOver(winnerColor, applyTrophy = true) {
            clearInterval(timerInterval);
            const overlay = document.getElementById('result-overlay');
            const resultTitle = document.getElementById('result-title');
            const resultDesc = document.getElementById('result-desc');
            const trophyDiff = document.getElementById('trophy-diff');
            const rematchBtn = document.getElementById('rematch-btn');

            overlay.classList.remove('hidden');

            const isMeWinner = (winnerColor === myColor);
            const isAi = (gameMode === 'ai');
            const isDraw = (winnerColor === 'draw');

            if (isAi) {
                rematchBtn.textContent = '🔄 한 판 더 (색 교대)';
                rematchBtn.disabled = false;
                document.getElementById('rematch-status-msg').textContent = '';
            }

            if (applyTrophy) {
                if (isDraw) {
                    trophyDiff.textContent = '변동 없음';
                    trophyDiff.className = 'text-2xl font-bold text-slate-300';
                } else if (isMeWinner) {
                    const gain = isAi ? AI_WIN_TROPHY : 30;
                    myTrophy += gain;
                    trophyDiff.textContent = `+${gain} 트로피`;
                    trophyDiff.className = 'text-2xl font-bold text-amber-400';

                    confetti({
                        particleCount: 150,
                        spread: 80,
                        origin: { y: 0.6 }
                    });
                } else if (isAi) {
                    // AI에게 져도 트로피는 깎이지 않는다
                    trophyDiff.textContent = '변동 없음';
                    trophyDiff.className = 'text-2xl font-bold text-slate-300';
                } else {
                    myTrophy = Math.max(0, myTrophy - 20);
                    trophyDiff.textContent = '-20 트로피';
                    trophyDiff.className = 'text-2xl font-bold text-red-400';
                }
                saveTrophy(); // Supabase profiles 테이블 (내 계정 행에만 저장)
            }

            if (isDraw) {
                resultTitle.textContent = '무승부';
                resultTitle.className = 'text-6xl font-black mb-2 tracking-wider text-slate-300';
                resultDesc.textContent = '판이 가득 찼습니다.';
            } else if (isMeWinner) {
                resultTitle.textContent = '🏆 승리!';
                resultTitle.className = 'text-6xl font-black mb-2 tracking-wider text-amber-400 animate-bounce';
                resultDesc.textContent = isAi ? 'AI를 제압하고 승리하였습니다!' : '상대를 제압하고 승리하였습니다!';
            } else {
                resultTitle.textContent = '패배...';
                resultTitle.className = 'text-6xl font-black mb-2 tracking-wider text-slate-500';
                resultDesc.textContent = '아쉽게 패배했습니다. 다음 기회에 도전하세요!';
            }

            updatePlayerCards();
            updateLobbyUI();
        }

        function countConsecutive(r, c, dr, dc, color) {
            let count = 0;
            let nr = r + dr;
            let nc = c + dc;
            while (nr >= 0 && nr < 15 && nc >= 0 && nc < 15 && boardState[nr][nc] === color) {
                count++;
                nr += dr;
                nc += dc;
            }
            return count;
        }

        document.getElementById('leave-btn').addEventListener('click', async () => {
            // 대기 중인 내 방이면 목록에서 바로 내려간다
            if (gameMode === 'online' && currentRoomId && roomStatus === 'waiting' && myColor === 'black') {
                stopHeartbeat();
                try {
                    await supabaseClient
                        .from('rooms')
                        .update({ host_seen_at: null })
                        .eq('id', currentRoomId)
                        .eq('status', 'waiting');
                } catch (e) { /* 무시 */ }
            }
            location.reload();
        });

        // =====================================================
        //                      AI 대전 모드
        // =====================================================

        document.getElementById('ai-start-btn').addEventListener('click', async () => {
            const nick = nicknameInput.value.trim();
            if (!nick) {
                showToast('본인의 닉네임을 입력해주세요!');
                return;
            }
            if (!(await ensureProfile(nick))) return;
            aiLevel = document.getElementById('ai-level-select').value;
            startAiGame('black');
        });

        function startAiGame(playerColor) {
            stopLobbyPolling();
            gameMode = 'ai';
            currentRoomId = null;
            myColor = playerColor;
            aiColor = (playerColor === 'black') ? 'white' : 'black';
            opponentNickname = `AI (${AI_LEVEL_LABEL[aiLevel]})`;
            roomStatus = 'playing';
            currentTurn = 'black';
            aiGameOver = false;
            aiThinking = false;
            boardState = Array(15).fill(null).map(() => Array(15).fill(null));

            lobbyScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            roomInfoDisplay.textContent = `AI 대전 · ${AI_LEVEL_LABEL[aiLevel]} · 승리 시 +${AI_WIN_TROPHY}🏆`;

            document.getElementById('result-overlay').classList.add('hidden');
            document.getElementById('rematch-status-msg').textContent = '';

            updatePlayerCards();
            initBoardUI();
            updateTurnUI();

            if (aiColor === 'black') aiMove();
        }

        // 돌을 놓고 승패/무승부를 판정한다. 게임이 끝났으면 true 반환
        function placeAiModeStone(r, c, color) {
            boardState[r][c] = color;
            renderStone(r, c, color);
            currentTurn = (color === 'black') ? 'white' : 'black';

            if (isFiveInRow(r, c, color)) {
                aiGameOver = true;
                updateTurnUI();
                setTimeout(() => handleGameOver(color, true), 400);
                return true;
            }

            if (boardState.every(row => row.every(cell => cell !== null))) {
                aiGameOver = true;
                updateTurnUI();
                setTimeout(() => handleGameOver('draw', true), 400);
                return true;
            }

            updateTurnUI();
            return false;
        }

        function aiMove() {
            aiThinking = true;
            setTimeout(() => {
                if (aiGameOver) { aiThinking = false; return; }
                const [r, c] = pickAiMove();
                placeAiModeStone(r, c, aiColor);
                aiThinking = false;
            }, 500);
        }

        function inBoard(r, c) {
            return r >= 0 && r < 15 && c >= 0 && c < 15;
        }

        function hasNeighborStone(r, c, dist) {
            for (let dr = -dist; dr <= dist; dr++) {
                for (let dc = -dist; dc <= dist; dc++) {
                    const nr = r + dr, nc = c + dc;
                    if (inBoard(nr, nc) && boardState[nr][nc] !== null) return true;
                }
            }
            return false;
        }

        // 한 방향 라인 점수: 연속 개수 + 양끝이 열려 있는지
        function lineScore(r, c, dr, dc, color) {
            let count = 1;
            let open = 0;

            let nr = r + dr, nc = c + dc;
            while (inBoard(nr, nc) && boardState[nr][nc] === color) { count++; nr += dr; nc += dc; }
            if (inBoard(nr, nc) && boardState[nr][nc] === null) open++;

            nr = r - dr; nc = c - dc;
            while (inBoard(nr, nc) && boardState[nr][nc] === color) { count++; nr -= dr; nc -= dc; }
            if (inBoard(nr, nc) && boardState[nr][nc] === null) open++;

            if (count >= 5) return 100000;
            if (count === 4) return open === 2 ? 10000 : (open === 1 ? 1500 : 0);
            if (count === 3) return open === 2 ? 1200 : (open === 1 ? 150 : 0);
            if (count === 2) return open === 2 ? 120 : (open === 1 ? 15 : 0);
            return open === 2 ? 3 : (open === 1 ? 1 : 0);
        }

        // 이 칸에 color 돌을 놓았을 때의 총점 (4방향 합 → 쌍삼/사삼 같은 복합 공격도 자연스럽게 높게 평가)
        function evalCell(r, c, color) {
            const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
            let total = 0;
            for (const [dr, dc] of dirs) total += lineScore(r, c, dr, dc, color);
            return total;
        }

        function pickAiMove() {
            let hasStone = false;
            for (let r = 0; r < 15 && !hasStone; r++) {
                for (let c = 0; c < 15; c++) {
                    if (boardState[r][c] !== null) { hasStone = true; break; }
                }
            }
            if (!hasStone) return [7, 7];

            const scored = [];
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    if (boardState[r][c] !== null) continue;
                    if (!hasNeighborStone(r, c, 2)) continue;

                    const attack = evalCell(r, c, aiColor);
                    const defense = evalCell(r, c, myColor);
                    const center = (14 - Math.abs(r - 7) - Math.abs(c - 7)) * 0.1;
                    // 내가 이기는 수(공격 5목)가 상대 5목 차단보다 우선
                    scored.push({ r, c, s: attack * 1.1 + defense + center });
                }
            }

            scored.sort((a, b) => b.s - a.s);
            if (scored.length === 0) {
                // 이웃이 없을 때(드문 경우): 아무 빈 칸
                for (let r = 0; r < 15; r++)
                    for (let c = 0; c < 15; c++)
                        if (boardState[r][c] === null) return [r, c];
            }

            let pick = scored[0];
            // 필승/필수 방어 수(만점대)는 난이도와 상관없이 항상 둔다
            const mustPlay = scored[0].s >= 10000;

            if (!mustPlay) {
                if (aiLevel === 'easy' && Math.random() < 0.4) {
                    pick = scored[Math.floor(Math.random() * Math.min(6, scored.length))];
                } else if (aiLevel === 'normal' && scored.length > 1 && Math.random() < 0.2) {
                    pick = scored[1];
                }
            }
            return [pick.r, pick.c];
        }

        // ===== 시작 =====
        initAuth().then(() => startLobbyPolling());
    </script>
