<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 멀티플레이 오목</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f0f0; margin: 0; padding: 20px; }
        h1 { margin-bottom: 10px; }
        #status { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; color: #333; }
        #controls { margin-bottom: 15px; display: flex; gap: 10px; }
        input, button { padding: 8px 12px; font-size: 1rem; }
        #board-container { position: relative; background: #e3a857; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border-radius: 4px; padding: 15px; }
        canvas { background: #e3a857; cursor: pointer; display: block; }
    </style>
</head>
<body>

    <h1>⚫ 실시간 오목 ⚪</h1>
    <div id="status">닉네임을 입력하고 방을 만들거나 참여하세요.</div>
    
    <div id="controls">
        <input type="text" id="username" placeholder="닉네임 입력" value="Player1">
        <button onclick="createRoom()">방 만들기</button>
        <input type="text" id="roomIdInput" placeholder="방 ID 입력">
        <button onclick="joinRoom()">참여하기</button>
    </div>

    <div id="board-container">
        <canvas id="omokCanvas" width="450" height="450"></canvas>
    </div>

<script>
    // -------------------------------------------------------------
    // 1. Supabase 설정 (여기에 본인의 키를 넣으세요!)
    // -------------------------------------------------------------
    const SUPABASE_URL = "https://lunsgjjznfhfbtfcvoye.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY"; // <-- 이 부분을 Supabase Publishable key로 변경
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // -------------------------------------------------------------
    // 2. 게임 변수 초기화
    // -------------------------------------------------------------
    const BOARD_SIZE = 15;
    const CELL_SIZE = 30;
    const canvas = document.getElementById("omokCanvas");
    const ctx = canvas.getContext("2d");
    
    let board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
    let currentRoomId = null;
    let myColor = null; 
    let currentTurn = 'black';
    let myName = '';
    let isGameActive = false;

    // -------------------------------------------------------------
    // 3. 오목판 그리기
    // -------------------------------------------------------------
    function drawBoard() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 1;

        for (let i = 0; i < BOARD_SIZE; i++) {
            ctx.beginPath();
            ctx.moveTo(15, 15 + i * CELL_SIZE);
            ctx.lineTo(435, 15 + i * CELL_SIZE);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(15 + i * CELL_SIZE, 15);
            ctx.lineTo(15 + i * CELL_SIZE, 435);
            ctx.stroke();
        }

        for (let x = 0; x < BOARD_SIZE; x++) {
            for (let y = 0; y < BOARD_SIZE; y++) {
                if (board[x][y]) {
                    ctx.beginPath();
                    ctx.arc(15 + x * CELL_SIZE, 15 + y * CELL_SIZE, 13, 0, Math.PI * 2);
                    ctx.fillStyle = board[x][y] === 'black' ? '#000' : '#fff';
                    ctx.fill();
                    ctx.strokeStyle = '#333';
                    ctx.stroke();
                }
            }
        }
    }
    drawBoard();

    // -------------------------------------------------------------
    // 4. 방 생성 및 입장 로직
    // -------------------------------------------------------------
    async function createRoom() {
        myName = document.getElementById("username").value || "Player1";
        const { data, error } = await supabase.from('rooms').insert([
            { player_black: myName, status: 'waiting' }
        ]).select().single();

        if (error) return alert("방 생성 실패: " + error.message);

        currentRoomId = data.id;
        myColor = 'black';
        document.getElementById("status").innerText = `방 생성 완료! (방 ID: ${currentRoomId}) 상대방 대기 중...`;
        subscribeToRoom();
    }

    async function joinRoom() {
        myName = document.getElementById("username").value || "Player2";
        const roomId = document.getElementById("roomIdInput").value.trim();
        if (!roomId) return alert("방 ID를 입력하세요.");

        const { data, error } = await supabase.from('rooms').update({
            player_white: myName,
            status: 'playing'
        }).eq('id', roomId).select().single();

        if (error || !data) return alert("방 참여 실패. ID를 확인하세요.");

        currentRoomId = roomId;
        myColor = 'white';
        isGameActive = true;
        document.getElementById("status").innerText = `게임 시작! 당신은 백돌(⚪)입니다. (흑돌 턴)`;
        subscribeToRoom();
        loadExistingMoves();
    }

    // -------------------------------------------------------------
    // 5. Supabase Realtime 구독
    // -------------------------------------------------------------
    function subscribeToRoom() {
        supabase.channel(`room:${currentRoomId}`)
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'moves', filter: `room_id=eq.${currentRoomId}` }, payload => {
                const move = payload.new;
                board[move.x][move.y] = move.color;
                currentTurn = move.color === 'black' ? 'white' : 'black';
                drawBoard();

                if (checkWin(move.x, move.y, move.color)) {
                    isGameActive = false;
                    document.getElementById("status").innerText = `🎉 게임 종료! ${move.color === 'black' ? '흑돌' : '백돌'} 승리!`;
                } else {
                    document.getElementById("status").innerText = `현재 턴: ${currentTurn === 'black' ? '흑돌(⚫)' : '백돌(⚪)'} ${currentTurn === myColor ? '(내 턴!)' : ''}`;
                }
            })
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `id=eq.${currentRoomId}` }, payload => {
                if (payload.new.status === 'playing' && myColor === 'black') {
                    isGameActive = true;
                    document.getElementById("status").innerText = `상대방(${payload.new.player_white}) 입장! 게임 시작! (당신의 턴입니다⚫)`;
                }
            })
            .subscribe();
    }

    async function loadExistingMoves() {
        const { data } = await supabase.from('moves').select('*').eq('room_id', currentRoomId);
        if (data) {
            data.forEach(m => { board[m.x][m.y] = m.color; });
            drawBoard();
        }
    }

    // -------------------------------------------------------------
    // 6. 착수 처리
    // -------------------------------------------------------------
    canvas.addEventListener('click', async (e) => {
        if (!isGameActive || currentTurn !== myColor) return;

        const rect = canvas.getBoundingClientRect();
        const x = Math.round((e.clientX - rect.left - 15) / CELL_SIZE);
        const y = Math.round((e.clientY - rect.top - 15) / CELL_SIZE);

        if (x < 0 || x >= BOARD_SIZE || y < 0 || y >= BOARD_SIZE || board[x][y] !== null) return;

        await supabase.from('moves').insert([
            { room_id: currentRoomId, x: x, y: y, color: myColor }
        ]);
    });

    // -------------------------------------------------------------
    // 7. 승리 판정
    // -------------------------------------------------------------
    function checkWin(x, y, color) {
        const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
        for (let [dx, dy] of dirs) {
            let count = 1;
            for (let i = 1; i < 5; i++) {
                let nx = x + dx * i, ny = y + dy * i;
                if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && board[nx][ny] === color) count++;
                else break;
            }
            for (let i = 1; i < 5; i++) {
                let nx = x - dx * i, ny = y - dy * i;
                if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && board[nx][ny] === color) count++;
                else break;
            }
            if (count >= 5) return true;
        }
        return false;
    }
</script>
</body>
</html>
