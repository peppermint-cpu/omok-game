<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 멀티 오목</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .board-grid {
            display: grid;
            grid-template-columns: repeat(15, minmax(0, 1fr));
            grid-template-rows: repeat(15, minmax(0, 1fr));
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-4">

    <!-- 헤더 -->
    <header class="w-full max-w-md text-center py-2">
        <h1 class="text-2xl font-bold text-amber-400">실시간 오목 대국</h1>
        <p id="status-msg" class="text-sm text-slate-400 mt-1">방을 만들거나 코드를 입력해 입장하세요.</p>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="w-full max-w-md flex flex-col items-center flex-grow justify-center">
        
        <!-- 대기실 / 방 선택 화면 -->
        <div id="lobby-screen" class="w-full bg-slate-800 p-6 rounded-2xl shadow-xl flex flex-col gap-4">
            <button id="create-room-btn" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl transition shadow-lg">
                방 만들기 (흑돌)
            </button>
            <div class="flex gap-2">
                <input type="text" id="room-code-input" placeholder="참여 코드 입력" class="flex-grow px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-amber-500 text-center uppercase tracking-widest">
                <button id="join-room-btn" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 font-bold rounded-xl transition shadow-lg">
                    입장 (백돌)
                </button>
            </div>
        </div>

        <!-- 게임 플레이 화면 (기본 숨김) -->
        <div id="game-screen" class="w-full hidden flex flex-col items-center gap-3">
            <div class="flex justify-between w-full px-2 text-sm font-semibold">
                <span id="player-role" class="text-amber-400">역할: 대기 중</span>
                <span id="turn-indicator" class="text-slate-300">차례 확인 중...</span>
            </div>
            
            <!-- 오목판 컨테이너 -->
            <div class="w-full aspect-square bg-amber-600 p-3 rounded-xl shadow-2xl relative flex items-center justify-center border-4 border-amber-800">
                <div id="omok-board" class="board-grid w-full h-full relative cursor-pointer">
                    <!-- 자바스크립트로 교차점 생성 -->
                </div>
            </div>

            <div class="flex justify-between w-full px-2 text-xs text-slate-400">
                <span id="room-info-display">방 코드: -</span>
                <button id="leave-btn" class="text-red-400 hover:underline">나가기</button>
            </div>
        </div>

    </main>

    <!-- 푸터 -->
    <footer class="w-full max-w-md text-center text-xs text-slate-500 py-2">
        Supabase Realtime Multiplayer Omok
    </footer>

    <!-- 로직 스크립트 -->
    <script>
        // ======= [SUPABASE 설정] =======
        const SUPABASE_URL = 'https://lunsgjjznfhfbtfcvoye.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_n7M5OMb_BIFAeJ0jdL9KBw_foAfZxeB';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentRoomId = null;
        let myColor = null; // 'black' 또는 'white'
        let boardState = Array(15).fill(null).map(() => Array(15).fill(null));
        let movesSubscription = null;

        const lobbyScreen = document.getElementById('lobby-screen');
        const gameScreen = document.getElementById('game-screen');
        const boardEl = document.getElementById('omok-board');
        const statusMsg = document.getElementById('status-msg');
        const turnIndicator = document.getElementById('turn-indicator');
        const playerRoleEl = document.getElementById('player-role');
        const roomCodeInput = document.getElementById('room-code-input');
        const roomInfoDisplay = document.getElementById('room-info-display');

        function initBoardUI() {
            boardEl.innerHTML = '';
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'relative flex items-center justify-center w-full h-full border border-amber-800/40';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    
                    cell.addEventListener('click', () => handleCellClick(r, c));
                    boardEl.appendChild(cell);
                }
            }
        }

        // 방 만들기 버튼
        document.getElementById('create-room-btn').addEventListener('click', async () => {
            const newRoomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
            
            const { data, error } = await supabaseClient
                .from('rooms')
                .insert([{ room_code: newRoomCode, status: 'waiting', turn: 'black' }])
                .select()
                .single();

            if (error) {
                alert('방 생성 실패: ' + error.message);
                return;
            }

            currentRoomId = data.id;
            myColor = 'black';
            startGameSession(newRoomCode, '흑돌 (당신)');
        });

        // 방 입장하기 버튼
        document.getElementById('join-room-btn').addEventListener('click', async () => {
            const code = roomCodeInput.value.trim().toUpperCase();
            if (!code) {
                alert('방 코드를 입력해주세요.');
                return;
            }

            const { data, error } = await supabaseClient
                .from('rooms')
                .select('*')
                .eq('room_code', code)
                .single();

            if (error || !data) {
                alert('존재하지 않는 방이거나 코드가 잘못되었습니다.');
                return;
            }

            currentRoomId = data.id;
            myColor = 'white';
            
            await supabaseClient.from('rooms').update({ status: 'playing' }).eq('id', currentRoomId);
            
            startGameSession(code, '백돌 (상대방)');
        });

        function startGameSession(code, roleText) {
            lobbyScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            roomInfoDisplay.textContent = `방 코드: ${code}`;
            playerRoleEl.textContent = `역할: ${roleText}`;
            statusMsg.textContent = '게임이 시작되었습니다!';
            
            initBoardUI();
            loadExistingMoves();
            subscribeToRealtime();
        }

        // 기존 수 불러오기 및 턴 동기화
        async function loadExistingMoves() {
            const { data, error } = await supabaseClient
                .from('moves')
                .select('*')
                .eq('room_id', currentRoomId)
                .order('created_at', { ascending: true });

            if (!error && data) {
                boardState = Array(15).fill(null).map(() => Array(15).fill(null));
                data.forEach(move => {
                    boardState[move.row][move.col] = move.color;
                    renderStone(move.row, move.col, move.color);
                });
                updateTurnState(data.length);
            }
        }

        // 실시간 구독 설정 (채널 이름 유니크하게 수정하여 반영 누락 방지)
        function subscribeToRealtime() {
            if (movesSubscription) {
                supabaseClient.removeChannel(movesSubscription);
            }

            movesSubscription = supabaseClient
                .channel(`room-${currentRoomId}`)
                .on('postgres_changes', { 
                    event: 'INSERT', 
                    schema: 'public', 
                    table: 'moves', 
                    filter: `room_id=eq.${currentRoomId}` 
                }, payload => {
                    const newMove = payload.new;
                    // 이미 그려진 곳이 아닐 때만 처리
                    if (!boardState[newMove.row][newMove.col]) {
                        boardState[newMove.row][newMove.col] = newMove.color;
                        renderStone(newMove.row, newMove.col, newMove.color);
                        
                        // 현재 총 착수 수 계산 후 턴 갱신
                        const totalMoves = boardState.flat().filter(cell => cell !== null).length;
                        updateTurnState(totalMoves);
                        
                        checkWinCondition(newMove.row, newMove.col, newMove.color);
                    }
                })
                .subscribe();
        }

        // 돌 클릭 이벤트
        async function handleCellClick(r, c) {
            if (!currentRoomId) return;
            
            const totalMoves = boardState.flat().filter(cell => cell !== null).length;
            const currentTurnColor = (totalMoves % 2 === 0) ? 'black' : 'white';

            // 내 차례 검증
            if (currentTurnColor !== myColor) {
                alert('지금은 내 차례가 아닙니다!');
                return;
            }

            if (boardState[r][c] !== null) {
                return; // 이미 돌이 있는 자리
            }

            // DB에 수 기록 (Realtime 구독을 통해 양쪽 화면에 자동 반영됨)
            const { error } = await supabaseClient
                .from('moves')
                .insert([{ room_id: currentRoomId, row: r, col: c, color: myColor }]);

            if (error) {
                alert('착수 실패: ' + error.message);
            }
        }

        function renderStone(r, c, color) {
            const cell = boardEl.querySelector(`[data-row='${r}'][data-col='${c}']`);
            if (!cell) return;
            cell.innerHTML = '';
            const stone = document.createElement('div');
            stone.className = `w-5/6 h-5/6 rounded-full shadow-lg z-10 ${color === 'black' ? 'bg-black' : 'bg-white border-2 border-slate-300'}`;
            cell.appendChild(stone);
        }

        function updateTurnState(totalMoves) {
            const currentTurnColor = (totalMoves % 2 === 0) ? 'black' : 'white';
            const isMyTurn = (currentTurnColor === myColor);
            
            if (isMyTurn) {
                turnIndicator.textContent = '내 차례입니다!';
                turnIndicator.className = 'text-amber-400 font-bold';
            } else {
                turnIndicator.textContent = '상대방 차례입니다...';
                turnIndicator.className = 'text-slate-300';
            }
        }

        function checkWinCondition(r, c, color) {
            const directions = [
                { dr: 0, dc: 1 },  
                { dr: 1, dc: 0 },  
                { dr: 1, dc: 1 },  
                { dr: 1, dc: -1 }  
            ];

            for (let { dr, dc } of directions) {
                let count = 1;
                count += countConsecutive(r, c, dr, dc, color);
                count += countConsecutive(r, c, -dr, -dc, color);

                if (count >= 5) {
                    alert(`[${color === 'black' ? '흑돌' : '백돌'} 승리!] 게임이 종료되었습니다.`);
                    location.reload();
                    return;
                }
            }
        }

        function countConsecutive(r, c, dr, dc, color) {
            let count = 0;
            let nr = r + dr;
            let nc = c + dc;
            while (nr >= 0 && nr < 15 && nc >= 0 && nc < 15 && boardState[nr][nc] === color) {
                count++;
                nr += dr;
                nc += dc;
            }
            return count;
        }

        document.getElementById('leave-btn').addEventListener('click', () => {
            location.reload();
        });
    </script>
</body>
</html>
