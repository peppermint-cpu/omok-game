<!DOCTYPE html>
<!--
  [Supabase 설정] 기존 SQL(profiles, rooms 컬럼, 정책)은 그대로 두고, 아이템전용으로 아래만 추가 실행하세요.
  (이미 실행했다면 이번 업데이트에는 추가 SQL이 필요 없습니다.)

  alter table public.rooms
    add column if not exists item_mode boolean not null default false,
    add column if not exists state jsonb;

  (rooms / moves 테이블의 Realtime 이 켜져 있어야 합니다.)
  [Render] GitHub 업로드 후 New > Static Site (Build Command 비움, Publish Directory: .)
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>오목 아레나</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root{--bg:#0d1024;--s1:#171b3a;--s2:#212756;--bd:#323a70;--gold:#f6b93b;--mint:#3ddbb0;--red:#ff5d73;--tx:#eef0ff;--mu:#8e94c8}
*{box-sizing:border-box;margin:0}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:radial-gradient(120% 70% at 50% -10%,#2a3270 0,var(--bg) 62%) fixed;color:var(--tx);min-height:100dvh;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{font:inherit;color:var(--tx);background:#0f1330;border:1px solid var(--bd);border-radius:12px;padding:12px;width:100%;outline:0}
input:focus,select:focus{border-color:var(--gold)}
.app{width:100%;max-width:440px;padding:16px 14px 30px}
.hidden{display:none!important}
.col{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.mu{color:var(--mu);font-size:13px}.tiny{font-size:11px;color:var(--mu)}
h1{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400;font-size:30px;text-align:center;color:var(--gold);letter-spacing:1px;text-shadow:0 3px 0 #7a4b00,0 8px 18px #f6b93b44;margin-bottom:12px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:14px}
.btn{padding:13px;border-radius:12px;font-weight:700;width:100%}
.gold{background:linear-gradient(#ffd166,#f2a31f);color:#2a1c00;box-shadow:0 3px 0 #a86a00}
.blue{background:#4c6fff;box-shadow:0 3px 0 #2c43b3}
.mint{background:#19c39a;color:#04251d;box-shadow:0 3px 0 #0e7a60}
.ghost{background:var(--s2);border:1px solid var(--bd)}
.btn:active{transform:translateY(2px);box-shadow:none}
.av{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--gold),#ff7a59);display:grid;place-items:center;font-size:26px;flex:none}
.tier{font-weight:700;color:var(--gold);font-size:16px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--s1);padding:5px;border-radius:14px;border:1px solid var(--bd)}
.tab{padding:10px 0;border-radius:10px;background:none;color:var(--mu);font-weight:700;font-size:14px}
.tab.on{background:var(--s2);color:var(--gold)}
.ttl{font-weight:700;font-size:15px}
.room{display:flex;gap:10px;align-items:center;background:var(--s2);border-radius:12px;padding:10px 12px}
.room button{padding:9px 16px;border-radius:10px;background:#4c6fff;font-weight:700;font-size:13px;flex:none}
.bdg{font-size:10px;padding:2px 7px;border-radius:99px;margin-right:6px;font-weight:700;display:inline-block}
.bdg.pub{background:#19c39a33;color:var(--mint)}.bdg.pri{background:#ff5d7333;color:var(--red)}.bdg.itm{background:#f6b93b33;color:var(--gold)}
.tgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tg{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 4px;border-radius:12px;background:#0f1330;border:1px solid var(--bd);font-size:13px;font-weight:700;cursor:pointer}
.tg input{display:none}
.tg:has(input:checked){border-color:var(--gold);background:#3a3410;color:var(--gold)}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:90;background:#2a2f62;border:1px solid var(--gold);color:#ffe4a3;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:500;max-width:92vw;text-align:center;box-shadow:0 8px 24px #0008}
#status{text-align:center;font-weight:700;font-size:14px;color:var(--mu);min-height:20px}
#status.me{color:var(--gold)}
.pc{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--s1);border:1px solid var(--bd);border-radius:14px;transition:.2s}
.pc.turn{border-color:var(--gold);box-shadow:0 0 0 3px #f6b93b33}
.si{width:28px;height:28px;border-radius:50%;flex:none}
.si.black{background:radial-gradient(circle at 35% 30%,#666,#000 65%)}
.si.white{background:radial-gradient(circle at 35% 30%,#fff,#c9cde0 75%)}
.nm{font-weight:700;font-size:14px}
.chip{font-size:10px;background:var(--s2);padding:2px 8px;border-radius:99px;color:var(--mu);margin-left:6px}
.tm{font-family:ui-monospace,monospace;font-size:15px;font-weight:700;color:var(--gold)}
.wrap{position:relative;aspect-ratio:1;padding:9px;border-radius:14px;background:linear-gradient(135deg,#e6b86a,#c88d3d);border:3px solid #7c4f17;box-shadow:0 14px 30px #0009,inset 0 0 18px #7c4f1766}
#board{display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);width:100%;height:100%;touch-action:manipulation}
.cell{position:relative;display:grid;place-items:center;cursor:pointer}
.cell::before,.cell::after{content:'';position:absolute;background:#6b4617}
.cell::before{left:0;right:0;top:50%;height:1px}
.cell::after{top:0;bottom:0;left:50%;width:1px}
.cell.c0::before{left:50%}.cell.c14::before{right:50%}.cell.r0::after{top:50%}.cell.r14::after{bottom:50%}
.sp{position:absolute;width:24%;height:24%;border-radius:50%;background:#6b4617}
.st{position:relative;z-index:2;width:88%;height:88%;border-radius:50%}
.st.new{animation:drop .18s ease-out}
.st.black{background:radial-gradient(circle at 35% 30%,#6a6a6a,#000 62%);box-shadow:1px 2px 3px #0009}
.st.white{background:radial-gradient(circle at 35% 30%,#fff,#cfd2e3 72%);box-shadow:1px 2px 3px #0007}
.st.block{border-radius:5px;width:80%;height:80%;background:#2a2f62;display:grid;place-items:center;font-size:11px;box-shadow:0 0 0 1px #000a}
.st.block::before{content:'🧱'}
.dot{position:absolute;z-index:3;width:24%;height:24%;border-radius:50%;background:var(--red);pointer-events:none}
@keyframes drop{from{transform:scale(1.5);opacity:0}}
.pc{position:relative}
.bub{position:absolute;right:12px;top:-24px;font-size:34px;z-index:5;animation:bub 2.4s ease-out forwards;pointer-events:none;filter:drop-shadow(0 4px 6px #0008)}
@keyframes bub{0%{transform:scale(.2) translateY(10px);opacity:0}12%{transform:scale(1.3);opacity:1}22%{transform:scale(1)}85%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
#emo-panel{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:8px}
#emo-panel button{font-size:24px;background:var(--s2);border-radius:10px;padding:6px 0}
#emo-panel button:active{transform:scale(.88)}
.st.hole{width:104%;height:104%;border-radius:0;background:radial-gradient(circle,#000 35%,#2a170a 100%);box-shadow:inset 0 0 14px #000}
#fx{position:absolute;inset:0;pointer-events:none;z-index:30;overflow:hidden;border-radius:11px}
.fx{position:absolute;transform:translate(-50%,-50%)}
.ring{width:16px;height:16px;border-radius:50%;border:4px solid #ffd166;animation:ring .55s ease-out forwards}
.ring.dust{border-color:#c9b48a}
@keyframes ring{to{width:150px;height:150px;opacity:0;border-width:1px}}
.pt{width:8px;height:8px;border-radius:50%;background:var(--c);animation:pt .65s ease-out forwards}
@keyframes pt{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}
.em{font-size:46px;animation:em .65s ease-out forwards}
@keyframes em{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}30%{transform:translate(-50%,-50%) scale(1.4);opacity:1}100%{transform:translate(-50%,-50%) scale(1.9);opacity:0}}
.flash{left:0;top:0;width:100%;height:100%;transform:none;background:radial-gradient(circle,#fffb,#ffd16688 50%,transparent 78%);animation:fl .5s ease-out forwards}
@keyframes fl{from{opacity:1}to{opacity:0}}
.st.boom{animation:boom .45s ease-in forwards}
@keyframes boom{30%{transform:scale(1.35);filter:brightness(2.5)}100%{transform:scale(0);opacity:0;filter:brightness(4)}}
.st.block.new{animation:slam .5s cubic-bezier(.3,.7,.4,1)}
@keyframes slam{0%{transform:translateY(-260%) scale(1.8);opacity:0}60%{transform:translateY(0) scale(1);opacity:1}78%{transform:translateY(-12%) scale(1.06)}100%{transform:none}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(2px,2px)}}
.slot.pop{animation:pop .6s}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.25);box-shadow:0 0 18px var(--gold)}100%{transform:none}}
.st.flip{animation:flip .5s forwards}
@keyframes flip{50%{transform:rotateY(90deg) scale(1.25);filter:brightness(2.2)}100%{transform:rotateY(0)}}
.flash.blue{background:radial-gradient(circle,#cfe6ffcc,#4c6fff66 55%,transparent 78%)}
.em.big{font-size:84px}
.met{font-size:40px;animation:met .45s ease-in forwards}
@keyframes met{from{transform:translate(calc(-50% - 130px),calc(-50% - 230px)) scale(.5)}to{transform:translate(-50%,-50%) scale(1.2)}}
.orc{width:34px;height:34px;border:3px solid #b28dff;border-radius:50%;box-shadow:0 0 14px #b28dff,inset 0 0 8px #b28dff;animation:orc .8s infinite alternate}
@keyframes orc{to{transform:translate(-50%,-50%) scale(1.35);opacity:.5}}
.em.sm{font-size:28px}
.mk{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;z-index:1;pointer-events:none;opacity:.85}
@keyframes pl{50%{transform:scale(.78)}}
.tg-black .st.black,.tg-white .st.white{animation:pl .7s infinite;box-shadow:0 0 0 2px var(--red)}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:8px 0;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:62px;justify-content:center}
.slot .ico{font-size:22px}
.slot.on{border-color:var(--gold);background:#3a3410}
.slot.empty{opacity:.3;cursor:default}
#hint{text-align:center;font-size:12px;color:var(--mu)}
.ov{position:fixed;inset:0;z-index:60;background:#05071ccc;backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px}
.ov .box{width:100%;max-width:300px;display:flex;flex-direction:column;gap:10px}
#r-title{font-family:'Black Han Sans',sans-serif;font-size:56px}
.tro{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:12px 28px;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="app">
<h1>🎯 오목 아레나</h1>
<div id="toast" class="hidden"></div>

<!-- 결과 -->
<div id="result" class="ov hidden">
  <div id="r-title"></div>
  <div id="r-desc" class="mu"></div>
  <div class="tro"><div class="tiny">트로피 변동</div><div id="r-diff" style="font-size:24px;font-weight:700"></div></div>
  <div class="box">
    <div id="rm-msg" class="mu" style="text-align:center;min-height:18px;color:var(--gold)"></div>
    <button id="rm-btn" class="btn blue" onclick="requestRematch()">🔄 재대결 요청</button>
    <button class="btn ghost" onclick="location.reload()">로비로 돌아가기</button>
  </div>
</div>

<!-- 비밀번호 -->
<div id="pw" class="ov hidden">
  <div class="card box">
    <div class="ttl" style="color:var(--gold)">🔒 비공개방 입장</div>
    <div id="pw-t" class="tiny"></div>
    <input type="password" id="pw-in" placeholder="비밀번호" maxlength="20">
    <div class="row"><button id="pw-no" class="btn ghost">취소</button><button id="pw-ok" class="btn blue">입장</button></div>
  </div>
</div>

<!-- 로비 -->
<section id="lobby" class="col">
  <div class="card col">
    <div class="row">
      <div class="av">⚫</div>
      <div class="grow"><div id="l-tier" class="tier"></div><div id="l-tro" class="mu"></div></div>
      <span id="auth" class="tiny">연결 중...</span>
    </div>
    <input id="nick" placeholder="닉네임 (2~10자, 중복 불가)" maxlength="10">
  </div>

  <nav class="tabs">
    <button class="tab on" data-t="rooms">🚪 방 목록</button>
    <button class="tab" data-t="create">➕ 방 만들기</button>
    <button class="tab" data-t="ai">🤖 AI 대전</button>
  </nav>

  <div id="p-rooms" class="card col">
    <div class="row"><span class="ttl grow">대기 중인 방</span><button id="refresh" class="tiny" style="background:none;color:#7f9bff">새로고침</button></div>
    <div id="room-list" class="col" style="max-height:300px;overflow-y:auto"></div>
    <div class="row"><input id="code" placeholder="방 코드" style="text-transform:uppercase;text-align:center;letter-spacing:3px"><button id="join" class="btn blue" style="width:90px">입장</button></div>
  </div>

  <div id="p-create" class="card col hidden">
    <input id="r-name" placeholder="방 제목 (비우면 자동)" maxlength="20">
    <div class="tgs">
      <label class="tg"><input type="checkbox" id="o-priv">🔒 비공개방</label>
      <label class="tg"><input type="checkbox" id="o-item">⚡ 아이템전</label>
    </div>
    <input type="password" id="r-pw" class="hidden" placeholder="비밀번호 (4자 이상)" maxlength="20">
    <div class="mu" id="item-desc" style="display:none">☢️ 🏗️ 🎰 🪤 ⛈️ 🔨 🌋 🔀 💣 🧱 ⚡ ☄️ 🛡️ … 34가지 아이템! 돌 3개마다 획득 (한 턴에 아이템은 여러 번 OK, 단 아이템을 쓰면 그 턴엔 돌을 못 둬요)</div>
    <button id="create" class="btn gold">방 만들기 (흑돌)</button>
  </div>

  <div id="p-ai" class="card col hidden">
    <div class="row"><span class="ttl grow">난이도</span><span class="mu">승리 시 +10 🏆</span></div>
    <select id="ai-lv"><option value="easy">쉬움</option><option value="normal" selected>보통</option><option value="hard">어려움</option></select>
    <label class="tg"><input type="checkbox" id="ai-item">⚡ 아이템전 (AI도 아이템을 써요)</label>
    <button id="ai-go" class="btn mint">AI와 대결 (흑돌)</button>
  </div>
</section>

<!-- 게임 -->
<section id="game" class="col hidden">
  <div id="status"></div>
  <div id="opp-card" class="pc">
    <div id="opp-si" class="si white"></div>
    <div class="grow"><div><span id="opp-nm" class="nm"></span><span id="opp-tier" class="chip"></span></div><div id="opp-tro" class="tiny"></div></div>
    <div id="opp-tm" class="tm">--</div>
  </div>
  <div class="wrap"><div id="board"></div><div id="fx"></div></div>
  <div id="items" class="items hidden"></div>
  <div id="hint" class="hidden"></div>
  <button id="endturn" class="btn ghost hidden" onclick="endTurn()">⏭️ 턴 넘기기</button>
  <div id="emo-panel" class="hidden"></div>
  <div id="my-card" class="pc">
    <div id="my-si" class="si black"></div>
    <div class="grow"><div><span id="my-nm" class="nm" style="color:var(--gold)"></span><span id="my-tier" class="chip"></span></div><div id="my-tro" class="tiny"></div></div>
    <div id="my-tm" class="tm">--</div>
  </div>
  <div class="row"><span id="room-info" class="tiny grow"></span><button id="emo-btn" style="background:none;color:var(--gold);font-size:13px">😊 이모티콘</button><button id="leave" style="background:none;color:var(--red);font-size:13px">나가기</button></div>
</section>
</div>

<script>
const sb = supabase.createClient('https://lunsgjjznfhfbtfcvoye.supabase.co','sb_publishable_n7M5OMb_BIFAeJ0jdL9KBw_foAfZxeB');
const $ = id => document.getElementById(id);
const h = (t,c,x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const empty = () => Array(15).fill(null).map(() => Array(15).fill(null));

let roomId = null, roomTitle = '', myColor = null, myNickname = '', oppName = '', currentTurn = 'black', roomStatus = 'waiting';
let boardState = empty(), myTrophy = parseInt(localStorage.getItem('omok_trophy_cache') || '100'), oppTrophy = 100;
let myUserId = null, myProfile = null, movesSub = null, roomSub = null, timerI = null, timeLeft = 30, wantRematch = false, prevWinner = null;
let gameMode = 'online', aiColor = 'white', aiLevel = 'normal', aiThinking = false, aiOver = false;
const AI_WIN = 10, AI_LBL = { easy:'쉬움', normal:'보통', hard:'어려움' };
const ALIVE = 90000;
let hbTimer = null, pollTimer = null, joining = false;

// ===== 아이템전 =====
const ITEMS = {
  bomb:   { i:'💣', n:'폭탄',    t:1, d:'상대 돌 1개를 골라 터뜨려요' },
  block:  { i:'🧱', n:'봉쇄',    t:1, d:'빈 칸 1곳을 영구히 막아요' },
  convert:{ i:'🔄', n:'개종',    t:1, d:'상대 돌 1개를 내 돌로 바꿔요' },
  meteor: { i:'☄️', n:'운석',    t:1, d:'터치한 곳 3×3 안의 상대 돌을 모두 파괴해요' },
  fire:   { i:'🔥', n:'화염',    t:1, d:'터치한 가로줄의 상대 돌을 모두 태워요' },
  wave:   { i:'🌊', n:'파도',    t:1, d:'터치한 세로줄의 상대 돌을 모두 쓸어내요' },
  slash:  { i:'⚔️', n:'참격',    t:1, d:'터치한 칸을 지나는 대각선 두 줄의 상대 돌을 모두 베어요' },
  mine:   { i:'🧨', n:'지뢰',    t:1, d:'빈 칸에 몰래 묻어요. 상대가 밟으면 돌이 사라지고 턴을 잃어요' },
  double: { i:'⚡', n:'연속',    d:'이번 턴에 돌을 두 번 놓아요 (바로 다음 턴에는 다시 못 써요)' },
  shield: { i:'🛡️', n:'방어막',  d:'상대의 다음 공격 아이템 1번을 막아요 (상대에게는 보이지 않아요)' },
  freeze: { i:'🧊', n:'동결',    d:'상대는 다음 턴에 아이템을 쓸 수 없어요' },
  rewind: { i:'⏪', n:'되감기',  d:'상대의 마지막 수를 취소해요' },
  sweep:  { i:'🧹', n:'청소',    d:'판 위의 봉쇄를 모두 치워요' },
  storm:  { i:'🌪️', n:'태풍',    d:'상대 돌 무작위 3개를 날려버려요' },
  detect: { i:'🔍', n:'지뢰탐지', d:'상대가 묻어둔 지뢰를 모두 찾아 없애요' },

async function hashPw(pw, salt) {
  const text = `${salt}:${pw}`;
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let x = 5381; for (let i = 0; i < text.length; i++) x = ((x * 33) ^ text.charCodeAt(i)) >>> 0;
  return 'x' + x.toString(16);
}

function askPassword(title) {
  return new Promise(res => {
    const m = $('pw'), inp = $('pw-in');
    $('pw-t').textContent = `방: ${title}`; inp.value = ''; m.classList.remove('hidden'); setTimeout(() => inp.focus(), 50);
    const close = v => { m.classList.add('hidden'); res(v); };
    $('pw-ok').onclick = () => close(inp.value);
    $('pw-no').onclick = () => close(null);
    inp.onkeydown = e => { if (e.key === 'Enter') close(inp.value); };
  });
}

function renderStone(r, c, color, quiet) {
  const cell = $('board').querySelector(`[data-row='${r}'][data-col='${c}']`);

  cell.querySelectorAll('.st,.dot').forEach(e => e.remove());

    $('board').querySelectorAll('.dot').forEach(e => e.remove());

async function tryJoin(id) {
  if (joining) return;
  const nick = $('nick').value.trim();
  if (!nick) return toast('본인의 닉네임을 입력해주세요!');
  joining = true;
  try {
    if (!(await ensureProfile(nick))) return;
    const { data:room } = await sb.from('rooms').select('*').eq('id', id).maybeSingle();
    if (!room) { toast('존재하지 않는 방입니다.'); return fetchRooms(); }
    const alive = room.host_seen_at && Date.now() - new Date(room.host_seen_at).getTime() < ALIVE;
    if (room.status !== 'waiting' || room.winner || !alive) { toast('이미 시작되었거나 닫힌 방입니다.'); return fetchRooms(); }
    if (room.black_player === myNickname) return toast('자신이 만든 방에는 입장할 수 없습니다.');
    if (room.is_private) {
      const pw = await askPassword(room.title || `${room.black_player}의 방`);
      if (pw === null) return;
      if (await hashPw(pw, room.room_code) !== room.password_hash) return toast('비밀번호가 틀렸습니다.');
    }
    const { data:rows, error } = await sb.from('rooms')
      .update({ status:'playing', white_player:myNickname, white_trophy:myTrophy })
      .eq('id', id).eq('status', 'waiting').select();

    roomId = room.id; roomTitle = room.title || `${room.black_player}의 방`;
    myColor = 'white'; gameMode = 'online'; oppName = room.black_player || '상대방'; oppTrophy = room.black_trophy || 100;
    startSession(room.room_code, 'playing');
  } finally { joining = false; }
}

function subscribe() {
  if (emoSub) sb.removeChannel(emoSub);
  emoSub = sb.channel(`emo-${roomId}`, { config:{ broadcast:{ self:false } } })
    .on('broadcast', { event:'emo' }, p => { const e = p.payload && p.payload.e; if (EMOS.includes(e)) showEmo('opp', e); }).subscribe();
  if (movesSub) sb.removeChannel(movesSub);
  if (roomSub) sb.removeChannel(roomSub);

  movesSub = sb.channel(`moves-${roomId}`).on('postgres_changes',
    { event:'INSERT', schema:'public', table:'moves', filter:`room_id=eq.${roomId}` }, p => {
      const m = p.new;
      if (boardState[m.row][m.col]) return;
      boardState[m.row][m.col] = m.color; renderStone(m.row, m.col, m.color);
      if (m.color !== 'block') checkWin(m.row, m.col, m.color);
    }).subscribe();

  roomSub = sb.channel(`rooms-${roomId}`).on('postgres_changes',
    { event:'UPDATE', schema:'public', table:'rooms', filter:`id=eq.${roomId}` }, p => {
      const u = p.new; if (!u) return;
      currentTurn = u.turn || 'black'; roomStatus = u.status || 'waiting';

      if (u.state) {
        const o = rs; rs = u.state;
        if (o && o.v !== rs.v && rs.msg) toast(rs.msg);
        const fx = o && rs.fx && (!o.fx || o.fx.k !== rs.fx.k) ? rs.fx : null;
        if (fx) playFx(fx.t, fx.r, fx.c, oppOf(myColor), fx.l);
        if (o && o.b !== rs.b) setTimeout(syncBoard, !fx ? 0 : fxWait(fx.t) + 50);
      }
      if (!u.winner) {
        if (prevWinner) { prevWinner = null; $('result').classList.add('hidden'); wantRematch = false; pending = null; acting = false; placing = false; $('rm-btn').textContent = '🔄 재대결 요청'; $('rm-btn').disabled = false; $('rm-msg').textContent = ''; syncBoard(); }
        myColor = u.black_player === myNickname ? 'black' : 'white';
      } else if ($('result').classList.contains('hidden')) handleGameOver(u.winner, true);

      if (u.turn === 'rematch_wait' && !wantRematch) $('rm-msg').textContent = '✨ 상대방이 재대결을 원합니다!';
      oppName = (myColor === 'black' ? u.white_player : u.black_player) || '';
      oppTrophy = (myColor === 'black' ? u.white_trophy : u.black_trophy) || 100;
      updateCards(); updateTurnUI(); renderItems();
    }).subscribe();
}

async function requestRematch() {
  if (gameMode === 'ai') return startAi(myColor === 'black' ? 'white' : 'black');
  const { data:room } = await sb.from('rooms').select('*').eq('id', roomId).single();
  if (!room) return;
  if (!wantRematch && room.turn !== 'rematch_wait') {
    wantRematch = true; $('rm-btn').textContent = '수락 대기 중...'; $('rm-btn').disabled = true;
    $('rm-msg').textContent = '상대방의 수락을 기다리는 중...';
    await sb.from('rooms').update({ turn:'rematch_wait' }).eq('id', roomId);
  } else {
    await sb.from('moves').delete().eq('room_id', roomId);
    const nb = room.white_player, nw = room.black_player;
    await sb.from('rooms').update({
      turn:'black', winner:null, black_player:nb, white_player:nw,
      black_trophy: nb === myNickname ? myTrophy : oppTrophy, white_trophy: nw === myNickname ? myTrophy : oppTrophy,
      state: room.item_mode ? newState() : null
    }).eq('id', roomId);
    myColor = nb === myNickname ? 'black' : 'white';
    $('result').classList.add('hidden'); wantRematch = false; prevWinner = null; boardState = empty(); initBoard();
    pending = null; acting = false; placing = false;
    $('rm-btn').textContent = '🔄 재대결 요청'; $('rm-btn').disabled = false; $('rm-msg').textContent = '';
  }
}

function playFx(t, r, c, by, list) {

  const add = (cls, x, y, txt, ttl) => { const e = h('div', 'fx ' + cls, txt); e.style.left = x + 'px'; e.style.top = y + 'px'; layer.appendChild(e); setTimeout(() => e.remove(), ttl || 900); return e; };
  const burst = (x, y, cols, n) => { for (let i = 0; i < n; i++) { const a = Math.PI * 2 * i / n + Math.random(), d = 35 + Math.random() * 45, e = add('pt', x, y); e.style.setProperty('--dx', Math.cos(a) * d + 'px'); e.style.setProperty('--dy', Math.sin(a) * d + 'px'); e.style.setProperty('--c', cols[i % cols.length]); } };
  const shake = () => { wrap.classList.remove('shake'); void wrap.offsetWidth; wrap.classList.add('shake'); };
  const mark = (a, b, cls) => { const cl = cellAt(a, b), st = cl && cl.querySelector('.st'); if (st) st.classList.add(cls); };
  const cx = lr.width / 2, cy = lr.height / 2;
  let x = cx, y = cy;
  if (r != null) { const cl = cellAt(r, c); if (cl) { const cr = cl.getBoundingClientRect(); x = cr.left - lr.left + cr.width / 2; y = cr.top - lr.top + cr.height / 2; } }
  if (t === 'bomb') { mark(r, c, 'boom'); add('ring', x, y); add('em', x, y, '💥'); burst(x, y, ['#ff5d73', '#ffd166', '#ff9f1c'], 14); shake(); }
  else if (t === 'mine') { add('ring', x, y); add('em', x, y, '💥'); burst(x, y, ['#ff5d73', '#ffd166'], 14); shake(); }
  else if (t === 'rewind') { mark(r, c, 'boom'); add('ring', x, y); add('em', x, y, '⏪'); burst(x, y, ['#7fb2ff', '#ffffff'], 12); }
  else if (t === 'convert') { mark(r, c, 'flip'); add('em', x, y, '🔄'); burst(x, y, ['#b28dff', '#ffffff'], 12); }
  else if (t === 'meteor') {
    add('met', x, y, '☄️', 500);
    setTimeout(() => {
      for (let a = r - 1; a <= r + 1; a++) for (let b = c - 1; b <= c + 1; b++) { const cl = cellAt(a, b), st = cl && cl.querySelector('.st.' + oppOf(by)); if (st) st.classList.add('boom'); }
      add('ring', x, y); add('em big', x, y, '💥'); burst(x, y, ['#ff5d73', '#ffd166', '#ff9f1c', '#ffffff'], 24); shake();
    }, 450);
  }
  else if (t === 'fire' || t === 'wave' || t === 'slash') {
    const ico = { fire:'🔥', wave:'🌊', slash:'⚔️' }[t], seq = [];
    if (t === 'slash') for (let i = -14; i <= 14; i++) { seq.push([r + i, c + i, (i + 14) * 30]); if (i) seq.push([r + i, c - i, (i + 14) * 30]); }
    else for (let i = 0; i < 15; i++) seq.push([t === 'fire' ? r : i, t === 'fire' ? i : c, i * 35]);
    seq.forEach(([a, b, d]) => setTimeout(() => {
      const cl = cellAt(a, b); if (!cl) return;
      const cr = cl.getBoundingClientRect();
      add('em sm', cr.left - lr.left + cr.width / 2, cr.top - lr.top + cr.height / 2, ico);
      const st = cl.querySelector('.st.' + oppOf(by)); if (st) st.classList.add('boom');
    }, d));
  }
  else if (t === 'storm') {
    (list || []).forEach(([a, b], i) => setTimeout(() => {
      const cl = cellAt(a, b); if (!cl) return;
      const cr = cl.getBoundingClientRect(), px = cr.left - lr.left + cr.width / 2, py = cr.top - lr.top + cr.height / 2, st = cl.querySelector('.st');
      if (st) st.classList.add('boom');
      add('em sm', px, py, '🌪️'); burst(px, py, ['#9ad0ff', '#ffffff'], 8);
    }, i * 200));

  }
  else if (t === 'block') setTimeout(() => { add('ring dust', x, y); burst(x, y, ['#a88b5c', '#7a6a58'], 8); shake(); }, 300);
  else if (t === 'sweep') { add('em big', cx, cy, '🧹'); burst(cx, cy, ['#c9b48a', '#7a6a58'], 14); }
  else if (t === 'double') { add('flash', 0, 0); add('em', cx, cy, '⚡'); burst(cx, cy, ['#ffd166', '#ffffff'], 16); }
  else if (t === 'shield' || t === 'freeze') { add('flash blue', 0, 0); add('em', cx, cy, t === 'shield' ? '🛡️' : '🧊'); burst(cx, cy, ['#7fb2ff', '#ffffff'], 14); }
  else if (t === 'dice') { add('em', cx, cy, '🎲'); burst(cx, cy, ['#ffd166', '#19c39a', '#ff5d73'], 14); }

  else if (t === 'luck') { add('em', cx, cy, '🍀'); burst(cx, cy, ['#3ddbb0', '#ffd166', '#ffffff'], 14); }
  else if (t === 'reroll') { add('em', cx, cy, '♻️'); burst(cx, cy, ['#19c39a', '#ffffff'], 12); }
  else if (t === 'detect') { add('em big', cx, cy, '🔍'); burst(cx, cy, ['#ffd166', '#ffffff'], 12); }

    add('met', x, y, '☢️', 500);
    setTimeout(() => {

      add('flash', 0, 0, '', 700); add('ring', x, y); add('em big', x, y, '☢️'); add('em big', x, y, '💥');
      burst(x, y, ['#ff5d73', '#ffd166', '#ff9f1c', '#ffffff'], 40); shake(); setTimeout(shake, 300);
    }, 450);

      const st = p.cl.querySelector('.st'); if (st) st.classList.add('boom');
      add('em sm', p.x, p.y, '🌋'); burst(p.x, p.y, ['#ff9f1c', '#a88b5c'], 8);
    }, i * 200));
    shake(); setTimeout(shake, 400);
  }
  else if (t === 'wall') {
    (list || []).forEach(([a, b], i) => setTimeout(() => {
      const p = fxCell(lr, a, b); if (!p) return;
      add('ring dust', p.x, p.y); burst(p.x, p.y, ['#a88b5c', '#7a6a58'], 6);

  }

  else if (t === 'thunder') {

      const p = fxCell(lr, a, b); if (!p) return;
      add('em sm', p.x, p.y, '⛈️'); burst(p.x, p.y, ['#ffd166', '#ffffff'], 6);
      const st = p.cl.querySelector('.st.' + oppOf(by)); if (st) st.classList.add('boom');
    }, i * 60));
    shake();
  }
  else if (t === 'jackpot') { add('em big', cx, cy, '🎰'); burst(cx, cy, ['#ffd166', '#ff5d73', '#19c39a'], 18); }
  else if (t === 'smash') { add('em big', cx, cy, '🔨'); burst(cx, cy, ['#7fb2ff', '#ffffff'], 14); shake(); }
  else if (t === 'field') { for (let a = r - 1; a <= r + 1; a++) for (let b = c - 1; b <= c + 1; b++) { const p = fxCell(lr, a, b); if (p) add('em sm', p.x, p.y, '🪤'); } }
  else if (t === 'oracle') add('orc', x, y, '', 4000);
}

function setPending(t) {
  pending = t;
  $('board').className = (t === 'bomb' || t === 'convert') ? 'tg-' + oppOf(myColor) : '';
  renderItems();
}

// 아이템을 소모하고 상태를 서버에 반영. 성공하면 true
// (서버 쪽에서도 "아직 내 차례일 때만" 반영되도록 turn 조건을 건다)
async function commitItem(item, extra) {
  const s = structuredClone(rs);
  norm(s); s.fx = null;
  const ix = s.inv[myColor].indexOf(item); if (ix < 0) return false;
  s.inv[myColor].splice(ix, 1);
  s.u = 1; s.v++; s.msg = `${myNickname}: ${ITEMS[item].i} ${ITEMS[item].n} 사용!`;
  if (extra) extra(s);
  const old = rs; rs = s;
  if (gameMode === 'online') {
    const { data, error } = await sb.from('rooms').update({ state:s }).eq('id', roomId).eq('turn', myColor).select('id');
    if (error || !data || !data.length) {
      rs = old; renderItems(); updateCards();
      toast(error ? '아이템 사용 실패: ' + error.message : '지금은 내 차례가 아니에요.');
      return false;
    }
  } else if (s.msg) toast(s.msg);
  setPending(null); updateCards();
  return true;
}

// 방어막이 공격을 막으면 true
async function blocked(t) {
  const opp = oppOf(myColor);
  if (!BLOCKABLE.includes(t) || !(rs.sd && rs.sd[opp])) return false;
  playFx('shield'); setPending(null);
  await commitItem(t, s => { s.sd[opp] = 0; s.msg = `🛡️ 방어막이 ${ITEMS[t].n}을(를) 막았다!`; s.fx = { k:Date.now(), t:'shield' }; });
  return true;
}

async function endTurn() {
  if (uiLocked() || !rs || !rs.u || currentTurn !== myColor || roomStatus !== 'playing') return;
  const me = myColor, opp = oppOf(me);
  placing = true;
  try {
    const s = structuredClone(rs); norm(s);
    s.u = 0; s.ld[me] = s.du[me]; s.du[me] = 0; s.fz[me] = 0; s.v++; s.fx = null; s.msg = `${myNickname}님이 턴을 넘겼어요`;
    if (gameMode === 'online') {
      const { data, error } = await sb.from('rooms').update({ turn:opp, state:s }).eq('id', roomId).eq('turn', me).select('id');
      if (error || !data || !data.length) return toast(error ? '턴 넘기기 실패: ' + error.message : '지금은 내 차례가 아니에요.');
    }
    rs = s; currentTurn = opp; setPending(null); updateTurnUI(); renderItems(); updateCards();
    if (gameMode === 'ai') aiMove();
  } finally { placing = false; }
}

function bestCell(col) {
  let b = [7, 7], bs = -1;
  for (let r = 0; r < 15; r++) for (let c = 0; c < 15; c++) if (boardState[r][c] === null && near(r, c, 2)) {
    const v = evalCell(r, c, col) * 1.1 + evalCell(r, c, oppOf(col)) + (14 - Math.abs(r - 7) - Math.abs(c - 7)) * 0.1;
    if (v > bs) { bs = v; b = [r, c]; }
  }
  return b;
}

function stonesOf(col) {
  const o = [];
  boardState.forEach((row, a) => row.forEach((v, b) => { if (v === col) o.push([a, b]); }));
  return o;
}
function pickStones(col, n) {
  const l = stonesOf(col), o = [];
  while (l.length && o.length < n) o.push(l.splice(Math.floor(Math.random() * l.length), 1)[0]);
  return o;
}

// 착수/아이템 처리 중이거나 연출 중이면 모든 입력을 막는다
const uiLocked = () => acting || placing || fxBusy || (gameMode === 'ai' && (aiThinking || aiOver));
// 연속(⚡)은 바로 다음 턴에 다시 쓸 수 없다
const doubleLocked = () => !!(rs && ((rs.ld && rs.ld[myColor]) || rs.dbl[myColor] || (rs.du && rs.du[myColor])));

async function pickItem(t) {
  if (uiLocked()) return;
  if (!rs || roomStatus !== 'playing' || currentTurn !== myColor) return toast('내 차례에만 쓸 수 있어요!');
  if (!rs.inv[myColor].includes(t)) return;
  if (rs.fz && rs.fz[myColor]) return toast('🧊 동결 상태! 이번 턴에는 아이템을 쓸 수 없어요');
  if (rs.dbl[myColor]) return toast('⚡ 연속 착수 중에는 아이템을 쓸 수 없어요!');
  if (t === 'double' && rs.u) return toast('⚡ 연속은 다른 아이템을 쓰기 전에만 쓸 수 있어요!');
  if (t === 'double' && doubleLocked()) return toast('⚡ 연속은 연속으로 쓸 수 없어요!');
  if (pending !== t) return setPending(t);          // 첫 터치: 선택 + 설명
  if (ITEMS[t].t) return setPending(null);          // 대상형: 다시 누르면 취소
  useInstant(t);                                    // 즉시형: 한 번 더 누르면 사용
}

async function useInstant(t) {
  if (acting) return;
  acting = true;
  try { await runInstant(t); } finally { acting = false; }
}

async function runInstant(t) {
  const me = myColor, opp = oppOf(me), ai = gameMode === 'ai', k = Date.now();
  if (!rs || !rs.inv[me].includes(t)) return;
  if (t === 'double' && doubleLocked()) return toast('⚡ 연속은 연속으로 쓸 수 없어요!');
  if (t === 'double' && rs.u) return toast('⚡ 연속은 다른 아이템을 쓰기 전에만 쓸 수 있어요!');
  if (t === 'thief' && !rs.inv[opp].length) return toast('훔칠 아이템이 없어요!');
  if (t === 'reroll' && rs.inv[me].length < 2) return toast('바꿀 다른 아이템이 없어요!');
  if (t === 'quake' || t === 'swap') {
    let qs = [];
    if (t === 'quake') { qs = pickStones(opp, 5); if (!qs.length) return toast('무너뜨릴 상대 돌이 없어요!'); }
    else if (!rs.inv[opp].length && rs.inv[me].length < 2) return toast('바꿀 아이템이 없어요!');
    if (await blocked(t)) return;
    setPending(null);
    if (t === 'swap') { playFx('swap'); return commitItem(t, s => { s.fx = { k, t }; const a = s.inv[me]; s.inv[me] = s.inv[opp]; s.inv[opp] = a; }); }
    fxBusy = true; setTimeout(() => fxBusy = false, 2000);
    playFx('quake', null, null, me, qs); await sleep(fxWait('quake'));
    if (!ai) {
      const res = await Promise.all(qs.map(([a, b]) => sb.from('moves').delete().eq('room_id', roomId).eq('row', a).eq('col', b)));
      const bad = res.find(x => x.error);
      if (bad) { syncBoard(); return toast('실패: ' + bad.error.message); }
    }
    qs.forEach(([a, b]) => boardState[a][b] = null);
    if (ai) redrawLocal(); else syncBoard();
    return commitItem(t, s => { s.b++; s.fx = { k, t, l:qs }; });
  }
  let pos = null, storm = null; const bl = [];
  if (t === 'storm') { storm = pickStones(opp, 3); if (!storm.length) return toast('날려버릴 상대 돌이 없어요!'); }
  if (t === 'rewind') {
    if (ai) pos = lastPos[opp] && boardState[lastPos[opp][0]][lastPos[opp][1]] === opp ? lastPos[opp] : null;
    else {
      const { data } = await sb.from('moves').select('row,col').eq('room_id', roomId).eq('color', opp).order('created_at', { ascending:false }).limit(1);
      pos = data && data[0] ? [data[0].row, data[0].col] : null;
    }
    if (!pos) return toast('되감을 상대 돌이 없어요!');
  }
  if (t === 'sweep') {
    boardState.forEach((row, a) => row.forEach((v, b) => { if (v === 'block') bl.push([a, b]); }));
    if (!bl.length) return toast('치울 봉쇄가 없어요!');
  }
  if (await blocked(t)) return;
  setPending(null);
  if (t === 'rewind') {
    fxBusy = true; setTimeout(() => fxBusy = false, 800);
    playFx('rewind', pos[0], pos[1]); await sleep(480);
    if (!ai) {
      const { error } = await sb.from('moves').delete().eq('room_id', roomId).eq('row', pos[0]).eq('col', pos[1]);
      if (error) { syncBoard(); return toast('실패: ' + error.message); }
    }
    boardState[pos[0]][pos[1]] = null;
    if (ai) { lastPos[opp] = null; redrawLocal(); } else syncBoard();
    return commitItem(t, s => { s.b++; s.fx = { k, t, r:pos[0], c:pos[1] }; });
  }
  if (t === 'sweep') {
    fxBusy = true; setTimeout(() => fxBusy = false, 800);
    playFx('sweep'); await sleep(500);
    if (!ai) {
      const { error } = await sb.from('moves').delete().eq('room_id', roomId).eq('color', 'block');
      if (error) { syncBoard(); return toast('실패: ' + error.message); }
    }
    bl.forEach(([a, b]) => boardState[a][b] = null);
    if (ai) redrawLocal(); else syncBoard();
    return commitItem(t, s => { s.b++; s.fx = { k, t }; });
  }
  if (t === 'storm') {
    fxBusy = true; setTimeout(() => fxBusy = false, 1600);
    playFx('storm', null, null, me, storm); await sleep(fxWait('storm'));
    if (!ai) {
      const res = await Promise.all(storm.map(([a, b]) => sb.from('moves').delete().eq('room_id', roomId).eq('row', a).eq('col', b)));
      const bad = res.find(x => x.error);
      if (bad) { syncBoard(); return toast('실패: ' + bad.error.message); }
    }
    storm.forEach(([a, b]) => boardState[a][b] = null);
    if (ai) redrawLocal(); else syncBoard();
    return commitItem(t, s => { s.b++; s.fx = { k, t, l:storm }; });
  }
  if (t === 'oracle') { const [r, c] = bestCell(me); playFx('oracle', r, c); return commitItem(t); }
  if (t === 'peek') {
    const txt = rs.inv[opp].map(x => ITEMS[x].i + ITEMS[x].n).join(', ') || '없음';
    if (await commitItem(t)) toast('🔭 상대 아이템: ' + txt, 6000);
    return;
  }
  playFx(t);
  await commitItem(t, s => {
    s.fx = { k, t };
    if (t === 'double') { s.dbl[me] = 1; s.du[me] = 1; s.u = 0; }
    if (t === 'shield') { s.sd[me] = 1; s.msg = ''; s.fx = null; toast('🛡️ 방어막 활성! (상대에게는 보이지 않아요)'); }
    if (t === 'smash') { s.msg = s.sd[opp] ? '🔨 방어막이 깨졌다!' : '🔨 깨뜨릴 방어막이 없었다...'; s.sd[opp] = 0; }
    if (t === 'jackpot') while (s.inv[me].length < 3) s.inv[me].push(rnd('jackpot'));
    if (t === 'freeze') s.fz[opp] = 1;
    if (t === 'dice') for (let i = 0; i < 2; i++) if (s.inv[me].length < 3) s.inv[me].push(rnd('dice'));
    if (t === 'luck') s.n[me] += (2 - s.n[me] % 3 + 3) % 3;
    if (t === 'reroll') s.inv[me] = s.inv[me].map(() => rnd('reroll'));
    if (t === 'detect') {
      const n = s.mines[opp].length; s.mines[opp] = [];
      s.msg = n ? `🔍 지뢰 ${n}개를 찾아 없앴다!` : '🔍 지뢰를 찾지 못했다...';
    }
    if (t === 'thief') {
      const oi = s.inv[opp], it = oi.splice(Math.floor(Math.random() * oi.length), 1)[0];
      if (s.inv[me].length < 3) s.inv[me].push(it);
      s.msg = `🦝 ${myNickname}님이 아이템을 훔쳤다!`;
    }
  });
}

const fxWait = t => ({ meteor:900, fire:1000, wave:1000, slash:1000, storm:1100, nuke:1100, cross:1000, quake:1500, thunder:700 })[t] || 480;

// 범위 판정 (해당 칸 (a,b)가 터치한 칸 (r,c) 기준 범위 안인지)
function inArea(t, a, b, r, c) {
  if (t === 'meteor') return Math.abs(a - r) <= 1 && Math.abs(b - c) <= 1;
  if (t === 'fire') return a === r;
  if (t === 'wave') return b === c;
  if (t === 'slash') return Math.abs(a - r) === Math.abs(b - c);
  if (t === 'nuke') return Math.abs(a - r) <= 3 && Math.abs(b - c) <= 3;
  if (t === 'cross') return a === r || b === c;
  if (t === 'thunder') return (a === r && Math.abs(b - c) <= 1) || (b === c && Math.abs(a - r) <= 1);
  return a === r && b === c;
}
// 범위 안에서 col 색 돌이 있는 칸들
function areaCells(t, r, c, col) {
  const out = [];
  for (let a = 0; a < 15; a++) for (let b = 0; b < 15; b++) if (inArea(t, a, b, r, c) && boardState[a][b] === col) out.push([a, b]);
  return out;
}

// 내가 묻은 지뢰 표시 (나만 보임)
function drawMines() {
  const B = $('board'); B.querySelectorAll('.mk').forEach(e => e.remove());
  if (!rs || !rs.mines || !myColor) return;
  (rs.mines[myColor] || []).forEach(([a, b]) => {
    if (boardState[a][b] !== null) return;
    const cl = B.querySelector(`[data-row='${a}'][data-col='${b}']`); if (cl) cl.appendChild(h('div', 'mk', '🧨'));
  });
}

async function useCellItem(r, c) {
  if (acting) return;
  acting = true;
  try { await runCellItem(r, c); } finally { acting = false; }
}

async function runCellItem(r, c) {
  const t = pending, me = myColor, opp = oppOf(me), ai = gameMode === 'ai', k = Date.now();
  if (!t || !rs || !rs.inv[me].includes(t)) return setPending(null);
  if (t === 'field') {
    const cs = [];
    for (let a = r - 1; a <= r + 1; a++) for (let b = c - 1; b <= c + 1; b++)
      if (inB(a, b) && boardState[a][b] === null && !((rs.mines && rs.mines[me]) || []).some(([x, y]) => x === a && y === b)) cs.push([a, b]);
    if (!cs.length) return toast('지뢰를 묻을 빈 칸이 없어요!');
    playFx('field', r, c);
    await commitItem('field', s => { cs.forEach(q => s.mines[me].push(q)); s.msg = `${myNickname}: 🪤 지뢰밭을 만들었다!`; });
    return drawMines();
  }
  if (t === 'nuke') {
    const hole = holeCells(r, c), cells = areaCells(t, r, c, opp);
    if (await blocked(t)) return;
    fxBusy = true; setTimeout(() => fxBusy = false, 1800);
    setPending(null); playFx(t, r, c); await sleep(fxWait(t));
    const del = cells.concat(hole.filter(([a, b]) => boardState[a][b] !== null && boardState[a][b] !== 'hole' && !cells.some(([x, y]) => x === a && y === b)));
    if (!ai && del.length) {
      const res = await Promise.all(del.map(([a, b]) => sb.from('moves').delete().eq('room_id', roomId).eq('row', a).eq('col', b)));
      const bad = res.find(x => x.error);
      if (bad) { syncBoard(); return toast('실패: ' + bad.error.message); }
    }
    cells.forEach(([a, b]) => boardState[a][b] = null);
    const ok = await commitItem(t, s => {
      s.holes = s.holes || [];
      hole.forEach(([a, b]) => { if (!s.holes.some(([x, y]) => x === a && y === b)) s.holes.push([a, b]); });
      s.b++; s.fx = { k, t, r, c };
    });
    if (ai) redrawLocal(); else syncBoard();
    return ok;
  }
  if (t === 'wall' || t === 'pillar' || t === 'fort' || t === 'gwall' || t === 'gpillar') {
    const cs = wallCells(t, r, c);
    if (!cs.length) return toast('막을 빈 칸이 없어요!');
    fxBusy = true; setTimeout(() => fxBusy = false, 900); setPending(null);
    if (ai) cs.forEach(([a, b]) => { boardState[a][b] = 'block'; renderStone(a, b, 'block'); });
    else {
      const { error } = await sb.from('moves').insert(cs.map(([a, b]) => ({ room_id:roomId, row:a, col:b, color:'block' })));
      if (error) return toast('실패: ' + error.message);
    }
    playFx('wall', r, c, me, cs);
    return commitItem(t, s => { s.fx = { k, t:'wall', r, c, l:cs }; });
  }
  if (t === 'block' || t === 'mine') {
    if (boardState[r][c] !== null) return toast('빈 칸을 선택하세요!');
    if (t === 'mine') {
      if (((rs.mines && rs.mines[me]) || []).some(([a, b]) => a === r && b === c)) return toast('이미 지뢰가 있는 칸이에요!');
      await commitItem('mine', s => { s.mines[me].push([r, c]); s.msg = `${myNickname}: 🧨 지뢰를 묻었다!`; });
      return drawMines();
    }
    fxBusy = true; setTimeout(() => fxBusy = false, 700); setPending(null);
    if (ai) { boardState[r][c] = 'block'; renderStone(r, c, 'block'); }
    else {
      const { error } = await sb.from('moves').insert([{ room_id:roomId, row:r, col:c, color:'block' }]);
      if (error) return toast('실패: ' + error.message);
    }
    playFx('block', r, c);
    return commitItem('block', s => { s.fx = { k, t, r, c }; });
  }
  const cells = areaCells(t, r, c, opp);
  if (!cells.length) return toast(t === 'bomb' || t === 'convert' ? '상대 돌을 선택하세요!' : '범위 안에 상대 돌이 없어요!');
  if (await blocked(t)) return;
  fxBusy = true; setTimeout(() => fxBusy = false, 1500);
  setPending(null); playFx(t, r, c); await sleep(fxWait(t));
  if (!ai) {
    const res = await Promise.all(cells.map(([a, b]) => {
      const q = sb.from('moves'), f = t === 'convert' ? q.update({ color:me }) : q.delete();
      return f.eq('room_id', roomId).eq('row', a).eq('col', b);
    }));
    const bad = res.find(x => x.error);
    if (bad) { syncBoard(); return toast('실패: ' + bad.error.message); }
  }
  cells.forEach(([a, b]) => boardState[a][b] = t === 'convert' ? me : null);
  if (t === 'convert') {
    const [a, b] = cells[0];
    if (ai) { if (isFive(a, b, me)) { aiOver = true; updateTurnUI(); setTimeout(() => handleGameOver(me, true), 400); } }
    else checkWin(a, b, me);
  }
  if (ai) redrawLocal(); else syncBoard();
  return commitItem(t, s => { s.b++; s.fx = { k, t, r, c }; });
}

// ===== 착수 / 승리 =====
async function handleCell(r, c) {
  if (fxBusy || acting) return;
  if (gameMode === 'ai') {
    if (aiOver || aiThinking) return;
    if (currentTurn !== myColor) return toast('지금은 내 차례가 아닙니다!');
    if (pending && ITEMS[pending].t) return useCellItem(r, c);
    if (boardState[r][c] !== null) return;
    if (rs && rs.u) return toast('아이템을 쓴 턴에는 돌을 둘 수 없어요. ⏭️ 턴 넘기기를 눌러주세요!');
    const dbl = rs && rs.dbl[myColor];
    if (rs) {
      rs.n[myColor]++;
      if (dbl) rs.dbl[myColor] = 0;
      else { rs.u = 0; rs.ld[myColor] = rs.du[myColor]; rs.du[myColor] = 0; rs.fz[myColor] = 0; }
      if (rs.n[myColor] % 3 === 0 && rs.inv[myColor].length < 3) { rs.inv[myColor].push(rnd()); toast('🎁 아이템 획득!'); }
    }
    const ended = placeAi(r, c, myColor);
    // 연속 착수 중 지뢰를 밟으면 턴이 넘어가므로 턴 종료 처리를 해 준다
    if (rs && dbl && ended === 'trap') { rs.u = 0; rs.ld[myColor] = rs.du[myColor]; rs.du[myColor] = 0; rs.fz[myColor] = 0; }
    if (ended !== true) { if (dbl && ended !== 'trap') { currentTurn = myColor; updateTurnUI(); } else aiMove(); }
    renderItems(); updateCards();
    return;
  }
  if (!roomId) return;
  if (!oppName || roomStatus !== 'playing') return toast('아직 상대방이 입장하지 않았습니다!');
  if (currentTurn !== myColor) return toast('지금은 내 차례가 아닙니다!');
  if (pending && ITEMS[pending].t) return useCellItem(r, c);
  if (boardState[r][c] !== null) return;
  if (rs && rs.u) return toast('아이템을 쓴 턴에는 돌을 둘 수 없어요. ⏭️ 턴 넘기기를 눌러주세요!');

  if (placing) return;
  placing = true;
  try {
    const opp = oppOf(myColor), prev = rs;
    let next = opp, s = null, trap = false;
    if (rs) {
      s = structuredClone(rs); norm(s); s.v++; s.msg = ''; s.fx = null;
      const mi = s.mines[opp].findIndex(([a, b]) => a === r && b === c);
      if (mi >= 0) {
        trap = true; s.mines[opp].splice(mi, 1); s.dbl[myColor] = 0;
        s.msg = `🧨 ${myNickname}님이 지뢰를 밟았다!`; s.fx = { k:Date.now(), t:'mine', r, c };
      } else {
        s.n[myColor]++;
        if (s.dbl[myColor]) { s.dbl[myColor] = 0; next = myColor; }
        if (s.n[myColor] % 3 === 0 && s.inv[myColor].length < 3) { s.inv[myColor].push(rnd()); s.msg = `🎁 ${myNickname} 아이템 획득!`; }
      }
      // 턴이 넘어갈 때만 "이번 턴 아이템 사용" 표시를 초기화 (연속 착수 중에는 아이템을 더 못 씀)
      if (next !== myColor) { s.u = 0; s.ld[myColor] = s.du[myColor]; s.du[myColor] = 0; s.fz[myColor] = 0; }
    }
    // 서버에서 "지금 정말 내 차례인지" 확인하면서 턴을 넘긴다 (연타해도 한 번만 성공)
    let q = sb.from('rooms').update(s ? { turn:next, state:s } : { turn:next }).eq('id', roomId).eq('turn', myColor);
    if (prev) q = q.eq('state->>v', String(prev.v));
    const { data, error } = await q.select('id');
    if (error) return toast('착수 실패: ' + error.message);
    if (!data || !data.length) {
      const { data:cur } = await sb.from('rooms').select('turn,state').eq('id', roomId).single();
      if (cur) { currentTurn = cur.turn; if (cur.state) rs = cur.state; updateTurnUI(); renderItems(); }
      return;
    }
    if (s) rs = s;
    currentTurn = next; updateTurnUI(); renderItems();
    if (trap) { playFx('mine', r, c); toast(s.msg); return; }
    const { error:mvErr } = await sb.from('moves').insert([{ room_id:roomId, row:r, col:c, color:myColor }]);
    if (mvErr) {
      toast('착수 실패: ' + mvErr.message);
      await sb.from('rooms').update(prev ? { turn:myColor, state:prev } : { turn:myColor }).eq('id', roomId);
    }
  } finally { placing = false; }
}

function countLine(r, c, dr, dc, color) {
  let n = 0; r += dr; c += dc;
  while (r >= 0 && r < 15 && c >= 0 && c < 15 && boardState[r][c] === color) { n++; r += dr; c += dc; }
  return n;
}
function isFive(r, c, color) {
  return [[0,1],[1,0],[1,1],[1,-1]].some(([dr, dc]) => 1 + countLine(r, c, dr, dc, color) + countLine(r, c, -dr, -dc, color) >= 5);
}
async function checkWin(r, c, color) {
  if (isFive(r, c, color)) { clearInterval(timerI); await sb.from('rooms').update({ winner:color }).eq('id', roomId); }
}

function handleGameOver(win, apply = true) {
  clearInterval(timerI); prevWinner = win;
  $('result').classList.remove('hidden');
  const ai = gameMode === 'ai', me = win === myColor, draw = win === 'draw';
  const diff = $('r-diff'), title = $('r-title');
  $('rm-btn').textContent = ai ? '🔄 한 판 더 (색 교대)' : '🔄 재대결 요청'; $('rm-btn').disabled = false; $('rm-msg').textContent = ''; wantRematch = false;
  if (apply) {
    if (draw || (!me && ai)) { diff.textContent = '변동 없음'; diff.style.color = 'var(--mu)'; }
    else if (me) {
      const g = ai ? AI_WIN : 30; myTrophy += g; diff.textContent = `+${g} 트로피`; diff.style.color = 'var(--gold)';
      confetti({ particleCount:150, spread:80, origin:{ y:0.6 } });
    } else { myTrophy = Math.max(0, myTrophy - 20); diff.textContent = '-20 트로피'; diff.style.color = 'var(--red)'; }
    saveTrophy();
  }
  if (draw) { title.textContent = '무승부'; title.style.color = 'var(--mu)'; $('r-desc').textContent = '판이 가득 찼습니다.'; }
  else if (me) { title.textContent = '🏆 승리!'; title.style.color = 'var(--gold)'; $('r-desc').textContent = ai ? 'AI를 제압했습니다!' : '상대를 제압했습니다!'; }
  else { title.textContent = '패배...'; title.style.color = 'var(--mu)'; $('r-desc').textContent = '아쉽네요. 다음 기회에 도전하세요!'; }
  updateCards(); updateLobby();
}

    try { await sb.from('rooms').update({ host_seen_at:null }).eq('id', roomId).eq('status', 'waiting'); } catch (e) {}

// ===== AI 대전 =====
$('ai-go').onclick = async () => {
  const nick = $('nick').value.trim();
  if (!nick) return toast('본인의 닉네임을 입력해주세요!');
  if (!(await ensureProfile(nick))) return;
  aiLevel = $('ai-lv').value; aiItemMode = $('ai-item').checked; startAi('black');
};

function startAi(color) {
  stopPolling(); gameMode = 'ai'; roomId = null; rs = aiItemMode ? newState() : null; pending = null; acting = false; placing = false; fxBusy = false;
  myColor = color; aiColor = oppOf(color); oppName = `AI (${AI_LBL[aiLevel]})`;
  roomStatus = 'playing'; currentTurn = 'black'; aiOver = false; aiThinking = false; boardState = empty(); lastPos = { black:null, white:null };
  $('lobby').classList.add('hidden'); $('game').classList.remove('hidden');
  $('room-info').textContent = `AI 대전 · ${AI_LBL[aiLevel]}${aiItemMode ? ' · ⚡아이템' : ''} · 승리 시 +${AI_WIN}🏆`;
  $('result').classList.add('hidden'); $('rm-msg').textContent = '';
  renderItems(); updateCards(); initBoard(); updateTurnUI();
  if (aiColor === 'black') aiMove();
}

function placeAi(r, c, color) {
  const mn = rs && rs.mines ? rs.mines[oppOf(color)] : null, mi = mn ? mn.findIndex(([a, b]) => a === r && b === c) : -1;
  if (mi >= 0) {
    mn.splice(mi, 1); playFx('mine', r, c); toast(color === myColor ? '🧨 지뢰를 밟았어요! 돌이 사라졌어요' : '🧨 AI가 지뢰를 밟았어요!');
    currentTurn = oppOf(color); drawMines(); updateTurnUI(); updateCards(); return 'trap';
  }
  boardState[r][c] = color; renderStone(r, c, color); currentTurn = oppOf(color); lastPos[color] = [r, c];
  if (isFive(r, c, color)) { aiOver = true; updateTurnUI(); setTimeout(() => handleGameOver(color, true), 400); return true; }
  if (boardState.every(row => row.every(x => x !== null))) { aiOver = true; updateTurnUI(); setTimeout(() => handleGameOver('draw', true), 400); return true; }
  updateTurnUI(); return false;
}

function redrawLocal() {
  initBoard();
  for (let r = 0; r < 15; r++) for (let c = 0; c < 15; c++) if (boardState[r][c]) renderStone(r, c, boardState[r][c], true);
  applyHoles(); drawMines();
}

function maxThreat(col) {
  let best = { s:0, r:7, c:7 };
  for (let r = 0; r < 15; r++) for (let c = 0; c < 15; c++)
    if (boardState[r][c] === null && near(r, c, 2)) { const s = evalCell(r, c, col); if (s > best.s) best = { s, r, c }; }
  return best;
}

// AI가 아이템을 쓸지 판단하고 사용한다. 연속착수를 썼으면 true
async function aiUseItem(used) {
  if (!rs) return false;
  const ai = aiColor, me = myColor, inv = rs.inv[ai];
  if (rs.fz && rs.fz[ai]) return false;
  if (!inv.length || Math.random() < { easy:.5, normal:.2, hard:0 }[aiLevel]) return false;
  const th = maxThreat(me), mine = maxThreat(ai).s, has = k => inv.includes(k), danger = th.s >= 1200;
  const lp = lastPos[me], lpOk = lp && boardState[lp[0]][lp[1]] === me;
  const dLock = rs.ld[ai] || rs.dbl[ai] || rs.du[ai];
  const nBlocks = boardState.flat().filter(v => v === 'block').length;
  if (mine >= 100000) return false;
  let use = null;
  if (danger && has('bomb')) use = 'bomb';
  else if (danger && has('convert')) use = 'convert';
  else if (danger && has('meteor')) use = 'meteor';
  else if (danger && has('fire')) use = 'fire';
  else if (danger && has('wave')) use = 'wave';
  else if (danger && has('slash')) use = 'slash';
  else if (danger && has('nuke')) use = 'nuke';
  else if (danger && has('cross')) use = 'cross';
  else if (danger && has('wall')) use = 'wall';
  else if (danger && has('pillar')) use = 'pillar';
  else if (danger && has('fort')) use = 'fort';
  else if (danger && has('gwall')) use = 'gwall';
  else if (danger && has('gpillar')) use = 'gpillar';
  else if (danger && has('thunder')) use = 'thunder';
  else if (has('smash') && rs.sd[me]) use = 'smash';
  else if (has('jackpot') && inv.length <= 1) use = 'jackpot';
  else if (has('field') && Math.random() < .5) use = 'field';
  else if (has('swap') && rs.inv[me].length > inv.length) use = 'swap';
  else if (has('quake') && stonesOf(me).length >= 8 && Math.random() < .5) use = 'quake';
  else if (th.s >= 10000 && has('rewind') && lpOk) use = 'rewind';
  else if (danger && has('block')) use = 'block';
  else if (has('shield') && !rs.sd[ai] && rs.inv[me].some(x => BLOCKABLE.includes(x))) use = 'shield';
  else if (mine >= 1200 && has('double') && !dLock && !used) use = 'double';
  else if (has('freeze') && rs.inv[me].length >= 2 && !rs.fz[me]) use = 'freeze';
  else if (has('mine') && Math.random() < .6) use = 'mine';
  else if (has('detect') && (rs.mines[me] || []).length) use = 'detect';
  else if (has('sweep') && nBlocks >= 2) use = 'sweep';
  else if (has('thief') && rs.inv[me].length) use = 'thief';
  else if (has('storm') && stonesOf(me).length >= 6 && Math.random() < .5) use = 'storm';
  else if (has('dice') && inv.length <= 2) use = 'dice';
  else if (has('luck') && inv.length <= 1) use = 'luck';
  else if (has('reroll') && inv.length >= 2 && Math.random() < .5) use = 'reroll';
  else if (has('peek') && inv.length >= 3) use = 'peek';
  else if (has('oracle') && inv.length >= 3) use = 'oracle';
  if (!use) return false;

  if (!danger && use !== 'double' && inv.length < 3 && Math.random() < .6) return false;
  inv.splice(inv.indexOf(use), 1);
  if (use !== 'shield') toast(`🤖 AI: ${ITEMS[use].i} ${ITEMS[use].n} 사용!`);
  if (BLOCKABLE.includes(use) && rs.sd[me]) {
    rs.sd[me] = 0; playFx('shield'); toast('🛡️ 방어막이 AI의 공격을 막았다!'); await sleep(600); updateCards(); renderItems(); return 'used';
  }
  if (use === 'bomb' || use === 'convert') {
    let pick = null, low = Infinity;
    for (let r = 0; r < 15; r++) for (let c = 0; c < 15; c++) if (boardState[r][c] === me) {
      boardState[r][c] = null; const t = maxThreat(me).s; boardState[r][c] = me;
      if (t < low) { low = t; pick = [r, c]; }
    }
    if (pick) {
      playFx(use, pick[0], pick[1], ai); await sleep(480);
      boardState[pick[0]][pick[1]] = use === 'convert' ? ai : null; redrawLocal();
      if (use === 'convert' && isFive(pick[0], pick[1], ai)) { aiOver = true; updateTurnUI(); setTimeout(() => handleGameOver(ai, true), 400); return 'end'; }
    }
  } else if (use === 'meteor' || use === 'fire' || use === 'wave' || use === 'slash' || use === 'nuke' || use === 'cross' || use === 'thunder') {
    let pick = null, low = Infinity;
    for (let r = 0; r < 15; r++) for (let c = 0; c < 15; c++) {
      const hit = areaCells(use, r, c, me);
      if (!hit.length) continue;
      hit.forEach(([a, b]) => boardState[a][b] = null); const t = maxThreat(me).s; hit.forEach(([a, b]) => boardState[a][b] = me);
      if (t < low) { low = t; pick = [r, c, hit]; }
    }
    if (pick) {
      playFx(use, pick[0], pick[1], ai); await sleep(fxWait(use)); pick[2].forEach(([a, b]) => boardState[a][b] = null);
      if (use === 'nuke') holeCells(pick[0], pick[1]).forEach(([a, b]) => { boardState[a][b] = 'hole'; if (!rs.holes.some(([x, y]) => x === a && y === b)) rs.holes.push([a, b]); });
      redrawLocal();
    }
  } else if (use === 'quake') {
    const lst = pickStones(me, 5);
    playFx('quake', null, null, ai, lst); await sleep(fxWait('quake'));
    lst.forEach(([a, b]) => boardState[a][b] = null); redrawLocal();
  } else if (use === 'wall' || use === 'pillar' || use === 'fort' || use === 'gwall' || use === 'gpillar') {
    const cs = wallCells(use, th.r, th.c);
    cs.forEach(([a, b]) => { boardState[a][b] = 'block'; renderStone(a, b, 'block'); });
    playFx('wall', th.r, th.c, ai, cs); await sleep(500);
  } else if (use === 'smash') { rs.sd[me] = 0; playFx('smash'); await sleep(400); }
  else if (use === 'jackpot') { while (inv.length < 3) inv.push(rnd('jackpot')); playFx('jackpot'); await sleep(400); }
  else if (use === 'field') {
    const [mr, mc] = bestCell(me);
    for (let a = mr - 1; a <= mr + 1; a++) for (let b = mc - 1; b <= mc + 1; b++) if (inB(a, b) && boardState[a][b] === null && !rs.mines[ai].some(([x, y]) => x === a && y === b)) rs.mines[ai].push([a, b]);
  }
  else if (use === 'swap') {
    const tmp = rs.inv[ai]; rs.inv[ai] = rs.inv[me]; rs.inv[me] = tmp; playFx('swap'); await sleep(400);
  } else if (use === 'storm') {
    const lst = pickStones(me, 3);
    playFx('storm', null, null, ai, lst); await sleep(fxWait('storm'));
    lst.forEach(([a, b]) => boardState[a][b] = null); redrawLocal();
  } else if (use === 'rewind') {
    playFx('rewind', lp[0], lp[1], ai); await sleep(480); boardState[lp[0]][lp[1]] = null; lastPos[me] = null; redrawLocal();
  } else if (use === 'block') {
    boardState[th.r][th.c] = 'block'; renderStone(th.r, th.c, 'block'); playFx('block', th.r, th.c);
  } else if (use === 'shield') { rs.sd[ai] = 1; await sleep(300); }
  else if (use === 'freeze') { rs.fz[me] = 1; playFx('freeze'); await sleep(400); }
  else if (use === 'double') { rs.du[ai] = 1; playFx('double'); await sleep(350); }
  else if (use === 'mine') { const [mr, mc] = bestCell(me); rs.mines[ai].push([mr, mc]); }
  else if (use === 'detect') {
    const n = rs.mines[me].length; rs.mines[me] = []; playFx('detect'); toast(`🔍 AI가 지뢰 ${n}개를 찾아 없앴다!`); await sleep(400);
  }
  else if (use === 'luck') { rs.n[ai] += (2 - rs.n[ai] % 3 + 3) % 3; playFx('luck'); await sleep(350); }
  else if (use === 'reroll') { for (let i = 0; i < inv.length; i++) inv[i] = rnd('reroll'); playFx('reroll'); await sleep(350); }
  else if (use === 'sweep') {
    playFx('sweep'); await sleep(500);
    for (let a = 0; a < 15; a++) for (let b = 0; b < 15; b++) if (boardState[a][b] === 'block') boardState[a][b] = null;
    redrawLocal();
  } else if (use === 'thief') {
    const oi = rs.inv[me], it = oi.splice(Math.floor(Math.random() * oi.length), 1)[0];
    if (inv.length < 3) inv.push(it); playFx('thief'); await sleep(400);
  } else if (use === 'dice') {
    for (let i = 0; i < 2; i++) if (inv.length < 3) inv.push(rnd('dice'));
    playFx('dice'); await sleep(400);
  }
  updateCards(); renderItems();
  return use === 'double' ? 'double' : 'used';
}

function aiMove() {
  aiThinking = true;
  setTimeout(async () => {
    if (aiOver) { aiThinking = false; return; }
    let dbl = false, used = false;
    for (let n = 0; n < 2 && !dbl; n++) {
      const res = await aiUseItem(used);
      if (res === 'end') { aiThinking = false; return; }
      if (!res) break;
      if (res === 'double') dbl = true; else used = true;
    }
    if (used && !dbl) {
      if (rs) { rs.ld[aiColor] = rs.du[aiColor]; rs.du[aiColor] = 0; rs.fz[aiColor] = 0; }
      currentTurn = myColor; aiThinking = false; toast('🤖 AI가 턴을 넘겼어요');
      updateTurnUI(); updateCards(); renderItems(); return;
    }
    let ended = false;
    for (let i = 0; i < (dbl ? 2 : 1) && !ended; i++) { if (i) await sleep(400); const [r, c] = pickAi(); ended = placeAi(r, c, aiColor); }
    if (rs) { rs.ld[aiColor] = rs.du[aiColor]; rs.du[aiColor] = 0; rs.fz[aiColor] = 0; }
    if (rs && !ended) {
      rs.n[aiColor]++;
      if (rs.n[aiColor] % 3 === 0 && rs.inv[aiColor].length < 3) rs.inv[aiColor].push(rnd());
      updateCards();
    }
    aiThinking = false;
  }, 500);
}

const inB = (r, c) => r >= 0 && r < 15 && c >= 0 && c < 15;
function near(r, c, d) {
  for (let i = -d; i <= d; i++) for (let j = -d; j <= d; j++) if (inB(r + i, c + j) && boardState[r + i][c + j] !== null) return true;
  return false;
}
function lineScore(r, c, dr, dc, color) {
  let n = 1, open = 0, a = r + dr, b = c + dc;
  while (inB(a, b) && boardState[a][b] === color) { n++; a += dr; b += dc; }
  if (inB(a, b) && boardState[a][b] === null) open++;
  a = r - dr; b = c - dc;
  while (inB(a, b) && boardState[a][b] === color) { n++; a -= dr; b -= dc; }
  if (inB(a, b) && boardState[a][b] === null) open++;
  if (n >= 5) return 100000;
  if (n === 4) return open === 2 ? 10000 : open === 1 ? 1500 : 0;
  if (n === 3) return open === 2 ? 1200 : open === 1 ? 150 : 0;
  if (n === 2) return open === 2 ? 120 : open === 1 ? 15 : 0;
  return open === 2 ? 3 : open;
}
const evalCell = (r, c, col) => [[0,1],[1,0],[1,1],[1,-1]].reduce((t, [dr, dc]) => t + lineScore(r, c, dr, dc, col), 0);

function pickAi() {
  if (boardState.every(row => row.every(x => x === null))) return [7, 7];
  const list = [];
  for (let r = 0; r < 15; r++) for (let c = 0; c < 15; c++) {
    if (boardState[r][c] !== null || !near(r, c, 2)) continue;
    list.push({ r, c, s: evalCell(r, c, aiColor) * 1.1 + evalCell(r, c, myColor) + (14 - Math.abs(r - 7) - Math.abs(c - 7)) * 0.1 });
  }
  if (!list.length) { for (let r = 0; r < 15; r++) for (let c = 0; c < 15; c++) if (boardState[r][c] === null) return [r, c]; }
  list.sort((a, b) => b.s - a.s);
  let p = list[0];
  if (list[0].s < 10000) {
    if (aiLevel === 'easy' && Math.random() < 0.4) p = list[Math.floor(Math.random() * Math.min(6, list.length))];
    else if (aiLevel === 'normal' && list.length > 1 && Math.random() < 0.2) p = list[1];
  }
  return [p.r, p.c];
}

initAuth().then(startPolling);
</script>
