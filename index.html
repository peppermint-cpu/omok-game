<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 멀티 오목</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Canvas Confetti (폭죽 효과) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        .board-grid {
            display: grid;
            grid-template-columns: repeat(15, minmax(0, 1fr));
            grid-template-rows: repeat(15, minmax(0, 1fr));
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-4 relative overflow-x-hidden">

    <!-- 승리/패배 오버레이 화면 -->
    <div id="result-overlay" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col items-center justify-center p-6 backdrop-blur-sm transition-all">
        <div id="result-title" class="text-6xl font-black mb-4 tracking-wider animate-bounce">승리!</div>
        <div id="result-desc" class="text-xl text-slate-300 mb-6 text-center">상대를 제압하고 승리하였습니다!</div>
        <div id="trophy-change-box" class="bg-slate-800 border border-slate-700 px-6 py-3 rounded-2xl text-center mb-6 shadow-xl">
            <span class="text-sm text-slate-400 block mb-1">트로피 변동</span>
            <span id="trophy-diff" class="text-2xl font-bold text-amber-400">+30 트로피</span>
        </div>

        <div class="w-full max-w-xs flex flex-col gap-3">
            <div id="rematch-status-msg" class="text-sm text-amber-300 text-center font-medium min-h-[20px]"></div>
            <button id="rematch-btn" onclick="requestRematch()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition text-base">
                🔄 재대결 요청
            </button>
            <button onclick="location.reload()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl transition text-sm border border-slate-700">
                로비로 돌아가기
            </button>
        </div>
    </div>

    <!-- 헤더 -->
    <header class="w-full max-w-md text-center py-2">
        <h1 class="text-2xl font-bold text-amber-400">실시간 오목 대국</h1>
        <p id="top-status-msg" class="text-sm text-slate-400 mt-1">닉네임을 입력하고 방을 만들거나 입장하세요.</p>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="w-full max-w-md flex flex-col items-center flex-grow justify-center gap-3">
        
        <!-- 커스텀 알림 배너 -->
        <div id="custom-toast" class="w-full bg-slate-800 border border-amber-500/50 text-amber-300 px-4 py-2 rounded-xl text-center text-sm shadow-lg hidden transition-all duration-300">
            알림 메시지 공간
        </div>

        <!-- 대기실 / 방 선택 화면 -->
        <div id="lobby-screen" class="w-full bg-slate-800 p-6 rounded-2xl shadow-xl flex flex-col gap-4">
            <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl flex items-center justify-between">
                <div>
                    <div class="text-xs text-slate-400 mb-0.5">내 계정 정보</div>
                    <div id="lobby-tier-display" class="text-sm font-bold text-amber-400">🥉 브론즈</div>
                </div>
                <div id="lobby-trophy-display" class="text-sm font-mono text-slate-300 font-semibold">🏆 100 트로피</div>
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">플레이어 닉네임</label>
                <input type="text" id="nickname-input" placeholder="본인 닉네임 입력" maxlength="10" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-amber-500 text-center text-white font-semibold">
            </div>
            <hr class="border-slate-700">
            <button id="create-room-btn" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl transition shadow-lg">
                방 만들기 (흑돌)
            </button>
            <div class="flex gap-2">
                <input type="text" id="room-code-input" placeholder="참여 코드 입력" class="flex-grow px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-amber-500 text-center uppercase tracking-widest font-bold">
                <button id="join-room-btn" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 font-bold rounded-xl transition shadow-lg">
                    입장 (백돌)
                </button>
            </div>
        </div>

        <!-- 게임 플레이 화면 -->
        <div id="game-screen" class="w-full hidden flex flex-col items-center gap-3">
            
            <div id="opponent-card" class="w-full bg-slate-800/80 border border-slate-700 p-3 rounded-xl flex items-center justify-between shadow-md">
                <div class="flex items-center gap-3">
                    <div id="opp-stone-icon" class="w-6 h-6 rounded-full bg-white border border-slate-400 shadow"></div>
                    <div>
                        <div class="flex items-center gap-2">
                            <span id="opp-name" class="font-bold text-sm text-slate-200">상대방 대기 중...</span>
                            <span id="opp-tier" class="text-[10px] bg-slate-700 px-2 py-0.5 rounded-full text-slate-300">브론즈</span>
                        </div>
                        <div id="opp-trophy" class="text-xs text-amber-400/80">🏆 100 트로피</div>
                    </div>
                </div>
                <div id="opp-timer" class="text-xs font-mono text-slate-400">--s</div>
            </div>

            <div class="w-full aspect-square bg-amber-600 p-3 rounded-xl shadow-2xl relative flex items-center justify-center border-4 border-amber-800">
                <div id="omok-board" class="board-grid w-full h-full relative cursor-pointer"></div>
            </div>

            <div id="my-card" class="w-full bg-slate-800 border-2 border-amber-500/60 p-3 rounded-xl flex items-center justify-between shadow-md">
                <div class="flex items-center gap-3">
                    <div id="my-stone-icon" class="w-6 h-6 rounded-full bg-black shadow"></div>
                    <div>
                        <div class="flex items-center gap-2">
                            <span id="my-name" class="font-bold text-sm text-amber-400">내 닉네임</span>
                            <span id="my-tier" class="text-[10px] bg-amber-500/20 border border-amber-500/40 px-2 py-0.5 rounded-full text-amber-300">브론즈</span>
                        </div>
                        <div id="my-trophy" class="text-xs text-amber-400">🏆 100 트로피</div>
                    </div>
                </div>
                <div id="my-timer" class="text-xs font-mono text-amber-400 font-bold">--s</div>
            </div>

            <div class="flex justify-between w-full px-2 text-xs text-slate-400 mt-1">
                <span id="room-info-display">방 코드: -</span>
                <button id="leave-btn" class="text-red-400 hover:underline">나가기</button>
            </div>
        </div>

    </main>

    <footer class="w-full max-w-md text-center text-xs text-slate-500 py-2">
        Supabase Realtime Multiplayer Omok
    </footer>

    <!-- 로직 스크립트 -->
    <script>
        const SUPABASE_URL = 'https://lunsgjjznfhfbtfcvoye.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_n7M5OMb_BIFAeJ0jdL9KBw_foAfZxeB';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentRoomId = null;
        let myColor = null; 
        let myNickname = '';
        let opponentNickname = '';
        let currentTurn = 'black';
        let roomStatus = 'waiting';
        let boardState = Array(15).fill(null).map(() => Array(15).fill(null));
        
        let myTrophy = parseInt(localStorage.getItem('omok_trophy') || '100');
        let oppTrophy = 100;

        let movesSubscription = null;
        let roomSubscription = null;
        let timerInterval = null;
        let timeLeft = 30;
        let hasRequestedRematch = false;

        const lobbyScreen = document.getElementById('lobby-screen');
        const gameScreen = document.getElementById('game-screen');
        const boardEl = document.getElementById('omok-board');
        const topStatusMsg = document.getElementById('top-status-msg');
        const roomCodeInput = document.getElementById('room-code-input');
        const roomInfoDisplay = document.getElementById('room-info-display');
        const customToast = document.getElementById('custom-toast');

        function getTier(trophy) {
            if (trophy >= 1000) return '👑 오목의 신';
            if (trophy >= 800) return '🔮 마스터';
            if (trophy >= 650) return '🟢 에메랄드';
            if (trophy >= 500) return '💎 다이아몬드';
            if (trophy >= 350) return '⚡ 플래티넘';
            if (trophy >= 250) return '🥇 골드';
            if (trophy >= 150) return '🥈 실버';
            return '🥉 브론즈';
        }

        function updateLobbyUI() {
            document.getElementById('lobby-trophy-display').textContent = `🏆 ${myTrophy} 트로피`;
            document.getElementById('lobby-tier-display').textContent = getTier(myTrophy);
        }
        updateLobbyUI();

        function showToast(msg, duration = 2500) {
            customToast.textContent = msg;
            customToast.classList.remove('hidden');
            setTimeout(() => {
                customToast.classList.add('hidden');
            }, duration);
        }

        function initBoardUI() {
            boardEl.innerHTML = '';
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'relative flex items-center justify-center w-full h-full border border-amber-800/40';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.addEventListener('click', () => handleCellClick(r, c));
                    boardEl.appendChild(cell);
                }
            }
        }

        document.getElementById('create-room-btn').addEventListener('click', async () => {
            const nick = document.getElementById('nickname-input').value.trim();
            if (!nick) {
                showToast('본인의 닉네임을 입력해주세요!');
                return;
            }
            myNickname = nick;
            myColor = 'black';

            const newRoomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
            
            const { data, error } = await supabaseClient
                .from('rooms')
                .insert([{ 
                    room_code: newRoomCode, 
                    status: 'waiting', 
                    turn: 'black',
                    black_player: myNickname,
                    black_trophy: myTrophy,
                    winner: null
                }])
                .select()
                .single();

            if (error) {
                showToast('방 생성 실패: ' + error.message);
                return;
            }

            currentRoomId = data.id;
            startGameSession(newRoomCode, 'waiting');
        });

        document.getElementById('join-room-btn').addEventListener('click', async () => {
            const nick = document.getElementById('nickname-input').value.trim();
            if (!nick) {
                showToast('본인의 닉네임을 입력해주세요!');
                return;
            }
            const code = roomCodeInput.value.trim().toUpperCase();
            if (!code) {
                showToast('방 코드를 입력해주세요.');
                return;
            }

            const { data, error } = await supabaseClient
                .from('rooms')
                .select('*')
                .eq('room_code', code)
                .single();

            if (error || !data) {
                showToast('존재하지 않는 방이거나 코드가 잘못되었습니다.');
                return;
            }

            currentRoomId = data.id;
            myNickname = nick;
            myColor = 'white';
            opponentNickname = data.black_player || '상대방';
            oppTrophy = data.black_trophy || 100;

            await supabaseClient
                .from('rooms')
                .update({ 
                    status: 'playing',
                    white_player: myNickname,
                    white_trophy: myTrophy
                })
                .eq('id', currentRoomId);
            
            startGameSession(code, 'playing');
        });

        function startGameSession(code, initialStatus) {
            lobbyScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            roomInfoDisplay.textContent = `방 코드: ${code}`;
            roomStatus = initialStatus;
            hasRequestedRematch = false;
            
            document.getElementById('result-overlay').classList.add('hidden');
            const rematchBtn = document.getElementById('rematch-btn');
            rematchBtn.textContent = '🔄 재대결 요청';
            rematchBtn.disabled = false;
            rematchBtn.className = 'w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition text-base';
            document.getElementById('rematch-status-msg').textContent = '';

            updatePlayerCards();
            initBoardUI();
            loadExistingData();
            subscribeToRealtime();
        }

        function updatePlayerCards() {
            document.getElementById('my-name').textContent = myNickname;
            document.getElementById('my-trophy').textContent = `🏆 ${myTrophy} 트로피`;
            document.getElementById('my-tier').textContent = getTier(myTrophy);
            document.getElementById('my-stone-icon').className = `w-6 h-6 rounded-full shadow ${myColor === 'black' ? 'bg-black' : 'bg-white border border-slate-400'}`;
            
            if (opponentNickname) {
                document.getElementById('opp-name').textContent = opponentNickname;
                document.getElementById('opp-trophy').textContent = `🏆 ${oppTrophy} 트로피`;
                document.getElementById('opp-tier').textContent = getTier(oppTrophy);
                const oppColor = (myColor === 'black') ? 'white' : 'black';
                document.getElementById('opp-stone-icon').className = `w-6 h-6 rounded-full shadow ${oppColor === 'black' ? 'bg-black' : 'bg-white border border-slate-400'}`;
            } else {
                document.getElementById('opp-name').textContent = '상대방 입장 대기 중...';
                document.getElementById('opp-trophy').textContent = '🏆 -- 트로피';
                document.getElementById('opp-tier').textContent = '대기 중';
            }
        }

        async function loadExistingData() {
            const { data: roomData } = await supabaseClient
                .from('rooms')
                .select('*')
                .eq('id', currentRoomId)
                .single();
            
            if (roomData) {
                currentTurn = roomData.turn || 'black';
                roomStatus = roomData.status || 'waiting';
                
                if (!roomData.winner) {
                    document.getElementById('result-overlay').classList.add('hidden');
                } else {
                    handleGameOver(roomData.winner, false);
                }

                if (myColor === 'black') {
                    opponentNickname = roomData.white_player || '';
                    oppTrophy = roomData.white_trophy || 100;
                } else {
                    opponentNickname = roomData.black_player || '';
                    oppTrophy = roomData.black_trophy || 100;
                }
                updatePlayerCards();
            }

            const { data, error } = await supabaseClient
                .from('moves')
                .select('*')
                .eq('room_id', currentRoomId)
                .order('created_at', { ascending: true });

            if (!error && data) {
                boardState = Array(15).fill(null).map(() => Array(15).fill(null));
                data.forEach(move => {
                    boardState[move.row][move.col] = move.color;
                    renderStone(move.row, move.col, move.color);
                });
            }
            updateTurnUI();
        }

        function subscribeToRealtime() {
            if (movesSubscription) supabaseClient.removeChannel(movesSubscription);
            if (roomSubscription) supabaseClient.removeChannel(roomSubscription);

            movesSubscription = supabaseClient
                .channel(`moves-${currentRoomId}`)
                .on('postgres_changes', { 
                    event: 'INSERT', 
                    schema: 'public', 
                    table: 'moves', 
                    filter: `room_id=eq.${currentRoomId}` 
                }, payload => {
                    const newMove = payload.new;
                    if (!boardState[newMove.row][newMove.col]) {
                        boardState[newMove.row][newMove.col] = newMove.color;
                        renderStone(newMove.row, newMove.col, newMove.color);
                        
                        currentTurn = (newMove.color === 'black') ? 'white' : 'black';
                        updateTurnUI();
                        checkWinCondition(newMove.row, newMove.col, newMove.color);
                    }
                })
                .on('postgres_changes', { 
                    event: 'DELETE', 
                    schema: 'public', 
                    table: 'moves', 
                    filter: `room_id=eq.${currentRoomId}` 
                }, () => {
                    boardState = Array(15).fill(null).map(() => Array(15).fill(null));
                    initBoardUI();
                })
                .subscribe();

            roomSubscription = supabaseClient
                .channel(`rooms-${currentRoomId}`)
                .on('postgres_changes', { 
                    event: 'UPDATE', 
                    schema: 'public', 
                    table: 'rooms', 
                    filter: `id=eq.${currentRoomId}` 
                }, payload => {
                    const updated = payload.new;
                    if (updated) {
                        currentTurn = updated.turn || 'black';
                        roomStatus = updated.status || 'waiting';

                        // 재대결로 winner가 null이 되고 흑백 역할이 교체된 경우
                        if (!updated.winner) {
                            document.getElementById('result-overlay').classList.add('hidden');
                            myColor = (updated.black_player === myNickname) ? 'black' : 'white';
                            hasRequestedRematch = false;
                            updatePlayerCards();
                        } else if (updated.winner && document.getElementById('result-overlay').classList.contains('hidden')) {
                            handleGameOver(updated.winner, true);
                        }

                        // 상대방이 재대결을 요청한 상태 감지 (turn에 'rematch_' 문구가 포함될 때)
                        if (updated.turn === 'rematch_wait' && !hasRequestedRematch) {
                            document.getElementById('rematch-status-msg').textContent = '✨ 상대방이 재대결을 원합니다!';
                        }

                        if (myColor === 'black') {
                            opponentNickname = updated.white_player || '';
                            oppTrophy = updated.white_trophy || 100;
                        } else {
                            opponentNickname = updated.black_player || '';
                            oppTrophy = updated.black_trophy || 100;
                        }
                        updatePlayerCards();
                        updateTurnUI();
                    }
                })
                .subscribe();
        }

        async function requestRematch() {
            const rematchBtn = document.getElementById('rematch-btn');
            const rematchMsg = document.getElementById('rematch-status-msg');

            const { data: currentRoom } = await supabaseClient
                .from('rooms')
                .select('*')
                .eq('id', currentRoomId)
                .single();

            if (!currentRoom) return;

            if (!hasRequestedRematch && currentRoom.turn !== 'rematch_wait') {
                // 첫 번째 요청자
                hasRequestedRematch = true;
                rematchBtn.textContent = '수락 대기 중...';
                rematchBtn.disabled = true;
                rematchBtn.className = 'w-full py-3.5 bg-slate-700 text-slate-400 font-bold rounded-xl shadow-lg cursor-not-allowed text-base';
                rematchMsg.textContent = '상대방의 수락을 기다리는 중...';

                await supabaseClient
                    .from('rooms')
                    .update({ turn: 'rematch_wait' })
                    .eq('id', currentRoomId);
            } else {
                // 상대방이 이미 요청한 상태에서 내가 누름 -> 수락 완료! 판 비우고 역할 교대 후 재시작
                await supabaseClient
                    .from('moves')
                    .delete()
                    .eq('room_id', currentRoomId);

                const newBlack = currentRoom.white_player;
                const newWhite = currentRoom.black_player;

                await supabaseClient
                    .from('rooms')
                    .update({
                        turn: 'black',
                        winner: null,
                        black_player: newBlack,
                        white_player: newWhite,
                        black_trophy: (newBlack === myNickname) ? myTrophy : oppTrophy,
                        white_trophy: (newWhite === myNickname) ? myTrophy : oppTrophy
                    })
                    .eq('id', currentRoomId);

                myColor = (newBlack === myNickname) ? 'black' : 'white';
                document.getElementById('result-overlay').classList.add('hidden');
                hasRequestedRematch = false;
                initBoardUI();
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            if (!opponentNickname || roomStatus !== 'playing') {
                document.getElementById('my-timer').textContent = '--s';
                document.getElementById('opp-timer').textContent = '--s';
                return;
            }

            timeLeft = 30;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (currentTurn === myColor) {
                        showToast('시간 초과!');
                    }
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const myTimerEl = document.getElementById('my-timer');
            const oppTimerEl = document.getElementById('opp-timer');

            if (!opponentNickname || roomStatus !== 'playing') {
                myTimerEl.textContent = '--s';
                oppTimerEl.textContent = '--s';
                return;
            }

            if (currentTurn === myColor) {
                myTimerEl.textContent = `${timeLeft}초`;
                oppTimerEl.textContent = '--s';
            } else {
                myTimerEl.textContent = '--s';
                oppTimerEl.textContent = `${timeLeft}초`;
            }
        }

        async function handleCellClick(r, c) {
            if (!currentRoomId) return;

            if (!opponentNickname || roomStatus !== 'playing') {
                showToast('아직 상대방이 입장하지 않았습니다!');
                return;
            }

            if (currentTurn !== myColor) {
                showToast('지금은 내 차례가 아닙니다!');
                return;
            }

            if (boardState[r][c] !== null) {
                return; 
            }

            const nextTurn = (myColor === 'black') ? 'white' : 'black';

            const { error: moveError } = await supabaseClient
                .from('moves')
                .insert([{ room_id: currentRoomId, row: r, col: c, color: myColor }]);

            if (moveError) {
                showToast('착수 실패: ' + moveError.message);
                return;
            }

            await supabaseClient
                .from('rooms')
                .update({ turn: nextTurn })
                .eq('id', currentRoomId);
        }

        function renderStone(r, c, color) {
            const cell = boardEl.querySelector(`[data-row='${r}'][data-col='${c}']`);
            if (!cell) return;
            cell.innerHTML = '';
            const stone = document.createElement('div');
            stone.className = `w-5/6 h-5/6 rounded-full shadow-lg z-10 ${color === 'black' ? 'bg-black' : 'bg-white border-2 border-slate-300'}`;
            cell.appendChild(stone);
        }

        function updateTurnUI() {
            resetTimer();
            if (!opponentNickname || roomStatus !== 'playing') {
                topStatusMsg.textContent = '상대방의 입장을 기다리는 중입니다...';
                topStatusMsg.className = 'text-sm text-slate-400 mt-1';
                return;
            }

            if (currentTurn === myColor) {
                topStatusMsg.textContent = '내 차례입니다!';
                topStatusMsg.className = 'text-sm text-amber-400 font-bold mt-1';
            } else {
                topStatusMsg.textContent = '상대방의 차례를 기다리는 중...';
                topStatusMsg.className = 'text-sm text-slate-400 mt-1';
            }
        }

        async function checkWinCondition(r, c, color) {
            const directions = [
                { dr: 0, dc: 1 },  
                { dr: 1, dc: 0 },  
                { dr: 1, dc: 1 },  
                { dr: 1, dc: -1 }  
            ];

            for (let { dr, dc } of directions) {
                let count = 1;
                count += countConsecutive(r, c, dr, dc, color);
                count += countConsecutive(r, c, -dr, -dc, color);

                if (count >= 5) {
                    clearInterval(timerInterval);
                    await supabaseClient
                        .from('rooms')
                        .update({ winner: color })
                        .eq('id', currentRoomId);
                    return;
                }
            }
        }

        function handleGameOver(winnerColor, applyTrophy = true) {
            clearInterval(timerInterval);
            const overlay = document.getElementById('result-overlay');
            const resultTitle = document.getElementById('result-title');
            const resultDesc = document.getElementById('result-desc');
            const trophyDiff = document.getElementById('trophy-diff');

            overlay.classList.remove('hidden');

            const isMeWinner = (winnerColor === myColor);

            if (applyTrophy) {
                if (isMeWinner) {
                    myTrophy += 30;
                    trophyDiff.textContent = '+30 트로피';
                    trophyDiff.className = 'text-2xl font-bold text-amber-400';

                    confetti({
                        particleCount: 150,
                        spread: 80,
                        origin: { y: 0.6 }
                    });
                } else {
                    myTrophy = Math.max(0, myTrophy - 20);
                    trophyDiff.textContent = '-20 트로피';
                    trophyDiff.className = 'text-2xl font-bold text-red-400';
                }
                localStorage.setItem('omok_trophy', myTrophy);
            }

            if (isMeWinner) {
                resultTitle.textContent = '🏆 승리!';
                resultTitle.className = 'text-6xl font-black mb-2 tracking-wider text-amber-400 animate-bounce';
                resultDesc.textContent = '상대를 제압하고 승리하였습니다!';
            } else {
                resultTitle.textContent = '패배...';
                resultTitle.className = 'text-6xl font-black mb-2 tracking-wider text-slate-500';
                resultDesc.textContent = '아쉽게 패배했습니다. 다음 기회에 도전하세요!';
            }

            updatePlayerCards();
            updateLobbyUI();
        }

        function countConsecutive(r, c, dr, dc, color) {
            let count = 0;
            let nr = r + dr;
            let nc = c + dc;
            while (nr >= 0 && nr < 15 && nc >= 0 && nc < 15 && boardState[nr][nc] === color) {
                count++;
                nr += dr;
                nc += dc;
            }
            return count;
        }

        document.getElementById('leave-btn').addEventListener('click', () => {
            location.reload();
        });
    </script>
</body>
</html>
